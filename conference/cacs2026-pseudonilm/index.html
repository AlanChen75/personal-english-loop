: "However, I was happy with my progress.", "start": 12.71291, "end": 15.16907}]}, {"number": 19, "title": "週末計畫 · Weekend Plans", "audio": "learning/pel100/pel100-019.mp3?v=8d067509d901a2ee", "transcript": "I'm going to visit my friends this weekend. We plan to have lunch together. If the weather is nice, we'll go for a walk. I hope we can spend more time together.", "sentence_cues": [{"text": "I'm going to visit my friends this weekend.", "start": 0.72136, "end": 3.0858}, {"text": "We plan to have lunch together.", "start": 3.78712, "end": 5.41017}, {"text": "If the weather is nice, we'll go for a walk.", "start": 6.31186, "end": 8.9368}, {"text": "I hope we can spend more time together.", "start": 11.53388, "end": 13.70942}]}, {"number": 20, "title": "認識新同事 · Meeting a New Colleague", "audio": "learning/pel100/pel100-020.mp3?v=a26b448eedee7b83", "transcript": "Welcome to the team. I joined this company three years ago. I mainly work on product development. If you need any help, feel free to ask me.", "sentence_cues": [{"text": "Welcome to the team.", "start": 0.54095, "end": 1.48261}, {"text": "I joined this company three years ago.", "start": 2.4443, "end": 4.4278}, {"text": "I mainly work on product development.", "start": 5.24924, "end": 7.51323}, {"text": "If you need any help, feel free to ask me.", "start": 8.43485, "end": 10.71887}]}, {"number": 21, "title": "搭計程車 · Taking a Taxi", "audio": "learning/pel100/pel100-021.mp3?v=5f6daf58810fcf68", "transcript": "Could you take me to this address? I'm running a little late for a meeting. If possible, please use the fastest route. Let me know when we're close to the building.", "sentence_cues": [{"text": "Could you take me to this address?", "start": 0.42082, "end": 2.064}, {"text": "I'm running a little late for a meeting.", "start": 4.32839, "end": 6.35231}, {"text": "If possible, please use the fastest route.", "start": 7.01359, "end": 9.57856}, {"text": "Let me know when we're close to the building.", "start": 11.134, "end": 12.94965}]}, {"number": 22, "title": "機場報到 · Airport Check-In", "audio": "learning/pel100/pel100-022.mp3?v=d7e9abfbfa3d680b", "transcript": "I'm checking in for my flight to Singapore. I have one suitcase to check and one carry-on bag. Could I have an aisle seat if one is available? Please let me know if the flight is on time.", "sentence_cues": [{"text": "I'm checking in for my flight to Singapore.", "start": 0.86225, "end": 3.1883}, {"text": "I have one suitcase to check and one carry-on bag.", "start": 4.33128, "end": 7.53963}, {"text": "Could I have an aisle seat if one is available?", "start": 8.6519, "end": 11.09936}, {"text": "Please let me know if the flight is on time.", "start": 12.1626, "end": 14.40945}]}, {"number": 23, "title": "特殊飲食需求 · Food Preferences", "audio": "learning/pel100/pel100-023.mp3?v=16b596813ed733cc", "transcript": "I'm looking for something without dairy. Do you have any dishes that would work for me? I can eat vegetables, rice, and seafood. If you're not sure, could you check with the kitchen?", "sentence_cues": [{"text": "I'm looking for something without dairy.", "start": 0.30062, "end": 2.48509}, {"text": "Do you have any dishes that would work for me?", "start": 3.16649, "end": 5.79187}, {"text": "I can eat vegetables, rice, and seafood.", "start": 6.61355, "end": 9.19885}, {"text": "If you're not sure, could you check with the kitchen?", "start": 10.57331, "end": 12.82942}]}, {"number": 24, "title": "寄送包裹 · Sending a Package", "audio": "learning/pel100/pel100-024.mp3?v=ac3e123e4c53a871", "transcript": "I'd like to send this package overseas. It contains some books and small gifts. How long will delivery usually take? I'd also like a tracking number if possible.", "sentence_cues": [{"text": "I'd like to send this package overseas.", "start": 0.40096, "end": 2.64636}, {"text": "It contains some books and small gifts.", "start": 3.30795, "end": 5.45311}, {"text": "How long will delivery usually take?", "start": 6.25504, "end": 8.21976}, {"text": "I'd also like a tracking number if possible.", "start": 9.19364, "end": 11.48958}]}, {"number": 25, "title": "銀行開戶 · Opening a Bank Account", "audio": "learning/pel100/pel100-025.mp3?v=40f6d858729acc19", "transcript": "I'd like to open a savings account. I already have my passport and identification documents. Could you explain the monthly fees? I'd also like to know whether I can manage the account online.", "sentence_cues": [{"text": "I'd like to open a savings account.", "start": 0.80153, "end": 2.62501}, {"text": "I already have my passport and identification documents.", "start": 3.78723, "end": 7.334}, {"text": "Could you explain the monthly fees?", "start": 7.97522, "end": 9.93897}, {"text": "I'd also like to know whether I can manage the account online.", "start": 11.37266, "end": 14.82961}]}, {"number": 26, "title": "網路故障 · An Internet Problem", "audio": "learning/pel100/pel100-026.mp3?v=d3a8e17c475a7137", "transcript": "My internet connection stopped working this morning. I've already restarted the router twice. The problem is still there. Could you help me check whether there's a service outage?", "sentence_cues": [{"text": "My internet connection stopped working this morning.", "start": 0.46109, "end": 3.06723}, {"text": "I've already restarted the router twice.", "start": 4.0696, "end": 6.6557}, {"text": "The problem is still there.", "start": 7.09674, "end": 8.37976}, {"text": "Could you help me check whether there's a service outage?", "start": 9.27251, "end": 12.22931}]}, {"number": 27, "title": "飯店房間問題 · A Problem With the Room", "audio": "learning/pel100/pel100-027.mp3?v=d4581df21ac978bf", "transcript": "I'm having trouble with the air conditioner. It doesn't seem to be working properly. Could someone come and take a look? If it can't be fixed, I'd like to change rooms.", "sentence_cues": [{"text": "I'm having trouble with the air conditioner.", "start": 3.02529, "end": 5.12897}, {"text": "It doesn't seem to be working properly.", "start": 5.81016, "end": 7.77359}, {"text": "Could someone come and take a look?", "start": 8.49485, "end": 10.19783}, {"text": "If it can't be fixed, I'd like to change rooms.", "start": 12.23263, "end": 15.02928}]}, {"number": 28, "title": "商品退貨 · Returning an Item", "audio": "learning/pel100/pel100-028.mp3?v=1ccf6415a76a2daf", "transcript": "I bought these headphones last week. Unfortunately, the left side doesn't work. I still have the receipt and the original box. Could I get a replacement or a refund?", "sentence_cues": [{"text": "I bought these headphones last week.", "start": 0.36092, "end": 2.08532}, {"text": "Unfortunately, the left side doesn't work.", "start": 2.38609, "end": 4.69197}, {"text": "I still have the receipt and the original box.", "start": 5.23335, "end": 7.59939}, {"text": "Could I get a replacement or a refund?", "start": 8.55293, "end": 10.56919}]}, {"number": 29, "title": "化解誤會 · Clearing Up a Misunderstanding", "audio": "learning/pel100/pel100-029.mp3?v=bdf4b19b8595529d", "transcript": "I think there was a misunderstanding. I didn't mean to cancel the meeting. I only wanted to change the time. Sorry if my message wasn't clear enough.", "sentence_cues": [{"text": "I think there was a misunderstanding.", "start": 0.56135, "end": 2.42583}, {"text": "I didn't mean to cancel the meeting.", "start": 3.18766, "end": 4.83161}, {"text": "I only wanted to change the time.", "start": 6.31518, "end": 8.17966}, {"text": "Sorry if my message wasn't clear enough.", "start": 9.21378, "end": 11.4493}]}, {"number": 30, "title": "安排會議 · Scheduling a Meeting", "audio": "learning/pel100/pel100-030.mp3?v=378bbbfa7e126e84", "transcript": "We need to discuss the new project. Are you available on Thursday afternoon? If that doesn't work, we can meet on Friday morning. Let me know which time is better for you.", "sentence_cues": [{"text": "We need to discuss the new project.", "start": 0.32064, "end": 2.14425}, {"text": "Are you available on Thursday afternoon?", "start": 2.86569, "end": 4.9899}, {"text": "If that doesn't work, we can meet on Friday morning.", "start": 5.89169, "end": 9.05797}, {"text": "Let me know which time is better for you.", "start": 10.97454, "end": 12.72916}]}, {"number": 31, "title": "說明議程 · Explaining the Agenda", "audio": "learning/pel100/pel100-031.mp3?v=9838e8bc57e4bf56", "transcript": "Today, we have three things to discuss. First, we'll review the project schedule. Next, we'll look at the main problems. Finally, we'll decide who will handle each task.", "sentence_cues": [{"text": "Today, we have three things to discuss.", "start": 0.26066, "end": 2.36604}, {"text": "First, we'll review the project schedule.", "start": 3.02772, "end": 5.23335}, {"text": "Next, we'll look at the main problems.", "start": 5.75468, "end": 7.57934}, {"text": "Finally, we'll decide who will handle each task.", "start": 8.91355, "end": 12.08911}]}, {"number": 32, "title": "工作優先順序 · Setting Priorities", "audio": "learning/pel100/pel100-032.mp3?v=262c1136b64c518f", "transcript": "We have several tasks to finish this week. Some are urgent, but others can wait. I suggest we focus on the customer issue first. After that, we can work on the new features.", "sentence_cues": [{"text": "We have several tasks to finish this week.", "start": 0.54108, "end": 2.98597}, {"text": "Some are urgent, but others can wait.", "start": 3.54709, "end": 5.63126}, {"text": "I suggest we focus on the customer issue first.", "start": 6.25251, "end": 9.11824}, {"text": "After that, we can work on the new features.", "start": 10.87374, "end": 12.96871}]}, {"number": 33, "title": "確認任務 · Clarifying a Task", "audio": "learning/pel100/pel100-033.mp3?v=8ef99b071145ad79", "transcript": "Before I start, I'd like to confirm the requirements. Do you need a short summary or a detailed report? I can prepare either one. I just want to make sure we're working toward the same goal.", "sentence_cues": [{"text": "Before I start, I'd like to confirm the requirements.", "start": 0.32074, "end": 3.16733}, {"text": "Do you need a short summary or a detailed report?", "start": 3.96919, "end": 6.61531}, {"text": "I can prepare either one.", "start": 7.33698, "end": 8.43954}, {"text": "I just want to make sure we're working toward the same goal.", "start": 9.83449, "end": 12.66957}]}, {"number": 34, "title": "尋求協助 · Asking for Help", "audio": "learning/pel100/pel100-034.mp3?v=1eff75e8d653cd83", "transcript": "I'm having trouble understanding this report. I've checked the numbers, but something doesn't look right. Could you review it with me? I think a second opinion would be helpful.", "sentence_cues": [{"text": "I'm having trouble understanding this report.", "start": 0.50113, "end": 2.84641}, {"text": "I've checked the numbers, but something doesn't look right.", "start": 3.36758, "end": 6.55476}, {"text": "Could you review it with me?", "start": 7.33652, "end": 8.53923}, {"text": "I think a second opinion would be helpful.", "start": 9.65286, "end": 12.06918}]}, {"number": 35, "title": "和朋友見面 · Meeting an Old Friend", "audio": "learning/pel100/pel100-035.mp3?v=ef8a6415109421ae", "transcript": "I met an old friend yesterday. We hadn't seen each other for years. We talked about our jobs and families. It felt as if no time had passed.", "sentence_cues": [{"text": "I met an old friend yesterday.", "start": 0.58103, "end": 1.98352}, {"text": "We hadn't seen each other for years.", "start": 3.06544, "end": 4.8486}, {"text": "We talked about our jobs and families.", "start": 5.71012, "end": 7.65357}, {"text": "It felt as if no time had passed.", "start": 8.93584, "end": 10.79915}]}, {"number": 36, "title": "睡眠與健康 · Getting Enough Sleep", "audio": "learning/pel100/pel100-036.mp3?v=097056940c2ded92", "transcript": "I didn't sleep well last night. I stayed up late to finish some work. As a result, I felt tired this morning. Tonight, I'll try to go to bed earlier.", "sentence_cues": [{"text": "I didn't sleep well last night.", "start": 0.36094, "end": 1.92501}, {"text": "I stayed up late to finish some work.", "start": 2.66695, "end": 4.67217}, {"text": "As a result, I felt tired this morning.", "start": 5.49431, "end": 7.68}, {"text": "Tonight, I'll try to go to bed earlier.", "start": 8.53323, "end": 11.12987}]}, {"number": 37, "title": "運動習慣 · Staying Active", "audio": "learning/pel100/pel100-037.mp3?v=c14f5b73dea56bb5", "transcript": "I started walking every evening last month. At first, it was difficult to keep going. Now I feel stronger and sleep better. Small changes can make a big difference.", "sentence_cues": [{"text": "I started walking every evening last month.", "start": 0.60125, "end": 2.80585}, {"text": "At first, it was difficult to keep going.", "start": 3.98831, "end": 6.35324}, {"text": "Now I feel stronger and sleep better.", "start": 7.23507, "end": 9.45971}, {"text": "Small changes can make a big difference.", "start": 10.49412, "end": 12.52954}]}, {"number": 38, "title": "我的家鄉 · My Hometown", "audio": "learning/pel100/pel100-038.mp3?v=eecce8740e08efa2", "transcript": "I grew up in a small town. It was quiet and had many beautiful places. Although I live in a big city now, I still miss my hometown. I visit it whenever I have time.", "sentence_cues": [{"text": "I grew up in a small town.", "start": 0.90148, "end": 2.38392}, {"text": "It was quiet and had many beautiful places.", "start": 3.3455, "end": 6.29035}, {"text": "Although I live in a big city now, I still miss my hometown.", "start": 7.51236, "end": 11.69924}, {"text": "I visit it whenever I have time.", "start": 13.09443, "end": 15.10969}]}, {"number": 39, "title": "面對壓力 · Dealing with Stress", "audio": "learning/pel100/pel100-039.mp3?v=e83b09776fce4f94", "transcript": "I sometimes feel stressed when I have too much work. When that happens, I take a short break. A few minutes of walking helps me think clearly. I've learned that rest is also important.", "sentence_cues": [{"text": "I sometimes feel stressed when I have too much work.", "start": 0.54154, "end": 3.5902}, {"text": "When that happens, I take a short break.", "start": 4.35236, "end": 6.81937}, {"text": "A few minutes of walking helps me think clearly.", "start": 8.09195, "end": 10.7393}, {"text": "I've learned that rest is also important.", "start": 11.9627, "end": 14.44961}]}, {"number": 40, "title": "錯過公車 · Missing the Bus", "audio": "learning/pel100/pel100-040.mp3?v=550d88e220eed07a", "transcript": "I missed the bus this morning. I arrived at the stop just a minute too late. The next bus wasn't coming for another twenty minutes. So I decided to take a taxi instead.", "sentence_cues": [{"text": "I missed the bus this morning.", "start": 0.42079, "end": 2.06385}, {"text": "I arrived at the stop just a minute too late.", "start": 3.00561, "end": 5.93107}, {"text": "The next bus wasn't coming for another twenty minutes.", "start": 6.85279, "end": 10.19903}, {"text": "So I decided to take a taxi instead.", "start": 11.67387, "end": 14.0491}]}, {"number": 41, "title": "每日工作會議 · Daily Team Meeting", "audio": "learning/pel100/pel100-041.mp3?v=ce19a3175f5fa13a", "transcript": "Yesterday, I finished the first version of the report. Today, I'll review it with the team. I still need some data from the sales department. Once I get it, I can finish the analysis.", "sentence_cues": [{"text": "Yesterday, I finished the first version of the report.", "start": 0.40124, "end": 3.47071}, {"text": "Today, I'll review it with the team.", "start": 4.33337, "end": 6.35963}, {"text": "I still need some data from the sales department.", "start": 7.2913, "end": 10.09918}, {"text": "Once I get it, I can finish the analysis.", "start": 11.26245, "end": 13.68927}]}, {"number": 42, "title": "進度報告 · Giving a Progress Update", "audio": "learning/pel100/pel100-042.mp3?v=8ee3cec20ad2d90c", "transcript": "The project is moving forward as planned. We've completed most of the testing. However, we still have a few technical issues. We expect to solve them by the end of the week.", "sentence_cues": [{"text": "The project is moving forward as planned.", "start": 0.32072, "end": 2.54573}, {"text": "We've completed most of the testing.", "start": 3.32749, "end": 5.1516}, {"text": "However, we still have a few technical issues.", "start": 5.75296, "end": 8.57932}, {"text": "We expect to solve them by the end of the week.", "start": 9.57209, "end": 12.34902}]}, {"number": 43, "title": "期限延後 · Explaining a Delay", "audio": "learning/pel100/pel100-043.mp3?v=badc02e5ee3fa05e", "transcript": "We may need two more days to finish the work. One of our suppliers delivered the materials late. As a result, we couldn't start testing on time. We're adjusting the schedule to reduce the delay.", "sentence_cues": [{"text": "We may need two more days to finish the work.", "start": 0.48128, "end": 3.02805}, {"text": "One of our suppliers delivered the materials late.", "start": 4.45184, "end": 7.43979}, {"text": "As a result, we couldn't start testing on time.", "start": 8.31136, "end": 10.75892}, {"text": "We're adjusting the schedule to reduce the delay.", "start": 11.56139, "end": 14.1895}]}, {"number": 44, "title": "回報問題 · Reporting an Issue", "audio": "learning/pel100/pel100-044.mp3?v=11c87764f5380212", "transcript": "We found a problem during yesterday's test. The system stopped responding after several hours. We haven't identified the cause yet. We're collecting more information before making changes.", "sentence_cues": [{"text": "We found a problem during yesterday's test.", "start": 0.48113, "end": 2.76652}, {"text": "The system stopped responding after several hours.", "start": 3.32785, "end": 6.07433}, {"text": "We haven't identified the cause yet.", "start": 6.57551, "end": 8.35972}, {"text": "We're collecting more information before making changes.", "start": 9.25251, "end": 12.14976}]}, {"number": 45, "title": "提出解決方案 · Suggesting a Solution", "audio": "learning/pel100/pel100-045.mp3?v=e08c3a4958115207", "transcript": "I think we should try a simpler approach. The current process takes too much time. If we automate one part of it, we could reduce manual work. Let's test the idea before making a larger change.", "sentence_cues": [{"text": "I think we should try a simpler approach.", "start": 0.48204, "end": 2.32987}, {"text": "The current process takes too much time.", "start": 2.6914, "end": 4.65974}, {"text": "If we automate one part of it, we could reduce manual work.", "start": 5.67145, "end": 9.50065}, {"text": "Let's test the idea before making a larger change.", "start": 10.24243, "end": 13.18952}]}, {"number": 46, "title": "給予建設性回饋 · Giving Feedback", "audio": "learning/pel100/pel100-046.mp3?v=f3c3112d6bd3c0d5", "transcript": "Your presentation was clear and easy to follow. I especially liked the examples. One thing you could improve is the final summary. It might help to end with a clear recommendation.", "sentence_cues": [{"text": "Your presentation was clear and easy to follow.", "start": 0.3006, "end": 2.72545}, {"text": "I especially liked the examples.", "start": 3.58717, "end": 5.5511}, {"text": "One thing you could improve is the final summary.", "start": 7.01403, "end": 9.5992}, {"text": "It might help to end with a clear recommendation.", "start": 10.83327, "end": 13.22946}]}, {"number": 47, "title": "接受批評 · Receiving Feedback", "audio": "learning/pel100/pel100-047.mp3?v=8779590fbbd37772", "transcript": "Thank you for your feedback. I hadn't noticed that problem before. I'll review the presentation and make some changes. Please let me know if there's anything else I should improve.", "sentence_cues": [{"text": "Thank you for your feedback.", "start": 1.20257, "end": 2.44522}, {"text": "I hadn't noticed that problem before.", "start": 3.2269, "end": 5.47169}, {"text": "I'll review the presentation and make some changes.", "start": 6.1331, "end": 9.11949}, {"text": "Please let me know if there's anything else I should improve.", "start": 10.07201, "end": 13.26978}]}, {"number": 48, "title": "說明數據 · Explaining Data", "audio": "learning/pel100/pel100-048.mp3?v=3f27c7671193e64a", "transcript": "Sales increased last month. However, our costs also went up. This means our profit didn't grow as much as expected. We need to understand what's driving the higher costs.", "sentence_cues": [{"text": "Sales increased last month.", "start": 0.40075, "end": 1.96366}, {"text": "However, our costs also went up.", "start": 2.7852, "end": 5.41009}, {"text": "This means our profit didn't grow as much as expected.", "start": 6.23163, "end": 10.09884}, {"text": "We need to understand what's driving the higher costs.", "start": 11.97481, "end": 14.70936}]}, {"number": 49, "title": "遠端協作 · Working Remotely", "audio": "learning/pel100/pel100-049.mp3?v=de7a7f3d94e0e67f", "transcript": "Our team works in different cities. We use online tools to share files and discuss ideas. Sometimes communication takes longer than expected. That's why we write down important decisions after each meeting.", "sentence_cues": [{"text": "Our team works in different cities.", "start": 0.5816, "end": 2.50689}, {"text": "We use online tools to share files and discuss ideas.", "start": 3.42942, "end": 7.07945}, {"text": "Sometimes communication takes longer than expected.", "start": 8.1714, "end": 11.1591}, {"text": "That's why we write down important decisions after each meeting.", "start": 11.80075, "end": 15.32984}]}, {"number": 50, "title": "了解客戶需求 · Understanding a Customer", "audio": "learning/pel100/pel100-050.mp3?v=d24587e19997186d", "transcript": "Before we suggest a solution, we need to understand the customer's problem. I'll ask how their current process works. Then I'll find out where they lose the most time. This information will help us design a better system.", "sentence_cues": [{"text": "Before we suggest a solution, we need to understand the customer's problem.", "start": 0.58137, "end": 4.89154}, {"text": "I'll ask how their current process works.", "start": 5.934, "end": 8.21939}, {"text": "Then I'll find out where they lose the most time.", "start": 9.37138, "end": 12.49936}, {"text": "This information will help us design a better system.", "start": 13.44176, "end": 16.6299}]}, {"number": 51, "title": "產品展示 · Demonstrating a Product", "audio": "learning/pel100/pel100-051.mp3?v=0b04a592861f9a3f", "transcript": "Let me show you how the system works. First, you connect the device to the network. The system then collects data automatically. If it detects a problem, it sends you a notification.", "sentence_cues": [{"text": "Let me show you how the system works.", "start": 0.52115, "end": 2.40532}, {"text": "First, you connect the device to the network.", "start": 3.10687, "end": 5.37188}, {"text": "The system then collects data automatically.", "start": 6.33401, "end": 8.91973}, {"text": "If it detects a problem, it sends you a notification.", "start": 9.91284, "end": 12.98956}]}, {"number": 52, "title": "處理團隊意見分歧 · Handling Disagreement", "audio": "learning/pel100/pel100-052.mp3?v=a8df2e9a8ae66c04", "transcript": "We have different opinions about this design. I understand why you prefer the first option. However, I'm concerned about its long-term cost. Could we compare both options before making a decision?", "sentence_cues": [{"text": "We have different opinions about this design.", "start": 0.46085, "end": 2.86531}, {"text": "I understand why you prefer the first option.", "start": 3.96735, "end": 6.61224}, {"text": "However, I'm concerned about its long-term cost.", "start": 7.35362, "end": 10.259}, {"text": "Could we compare both options before making a decision?", "start": 11.69277, "end": 15.00969}]}, {"number": 53, "title": "專案檢討 · Reviewing a Project", "audio": "learning/pel100/pel100-053.mp3?v=6a54154614a1f568", "transcript": "We finished the project last week. Some parts went well, but others took longer than expected. We've learned several lessons from the experience. Next time, we'll spend more time checking the requirements at the beginning.", "sentence_cues": [{"text": "We finished the project last week.", "start": 0.88237, "end": 2.5669}, {"text": "Some parts went well, but others took longer than expected.", "start": 3.44927, "end": 7.25951}, {"text": "We've learned several lessons from the experience.", "start": 8.13068, "end": 10.89616}, {"text": "Next time, we'll spend more time checking the requirements at the beginning.", "start": 12.35907, "end": 16.92813}]}, {"number": 54, "title": "學英文的原因 · Why I Learn English", "audio": "learning/pel100/pel100-054.mp3?v=1a0e958e78b87fe6", "transcript": "I've been learning English for several months. I want to speak more naturally. Sometimes I know the words but cannot make a sentence quickly. That's why I practice speaking every day.", "sentence_cues": [{"text": "I've been learning English for several months.", "start": 0.34131, "end": 2.54981}, {"text": "I want to speak more naturally.", "start": 3.45328, "end": 5.13977}, {"text": "Sometimes I know the words but cannot make a sentence quickly.", "start": 5.99131, "end": 9.30116}, {"text": "That's why I practice speaking every day.", "start": 10.08349, "end": 12.12958}]}, {"number": 55, "title": "今年的目標 · My Goals This Year", "audio": "learning/pel100/pel100-055.mp3?v=f500b01cc018915c", "transcript": "I set three goals at the beginning of this year. One of them was to improve my English. I've made some progress, but I still need more practice. By the end of the year, I hope to speak with more confidence.", "sentence_cues": [{"text": "I set three goals at the beginning of this year.", "start": 0.62183, "end": 3.02891}, {"text": "One of them was to improve my English.", "start": 4.39292, "end": 6.63953}, {"text": "I've made some progress, but I still need more practice.", "start": 7.4908, "end": 10.6181}, {"text": "By the end of the year, I hope to speak with more confidence.", "start": 11.84096, "end": 15.48948}]}, {"number": 56, "title": "班機延誤 · A Delayed Flight", "audio": "learning/pel100/pel100-056.mp3?v=69034f0cacb98533", "transcript": "My flight has been delayed by two hours. I was supposed to arrive before dinner. Now I need to change my plans. I'll let my friends know as soon as I have a new arrival time.", "sentence_cues": [{"text": "My flight has been delayed by two hours.", "start": 0.40092, "end": 3.14722}, {"text": "I was supposed to arrive before dinner.", "start": 4.08938, "end": 6.13407}, {"text": "Now I need to change my plans.", "start": 6.61517, "end": 8.57968}, {"text": "I'll let my friends know as soon as I have a new arrival time.", "start": 9.47214, "end": 12.76968}]}, {"number": 57, "title": "在藥局詢問 · At the Pharmacy", "audio": "learning/pel100/pel100-057.mp3?v=90776d1ac5c346f1", "transcript": "I've had a sore throat since yesterday. I don't have a fever, but it hurts when I swallow. Is there anything that might help? Could you explain how to use it safely?", "sentence_cues": [{"text": "I've had a sore throat since yesterday.", "start": 0.82171, "end": 2.82589}, {"text": "I don't have a fever, but it hurts when I swallow.", "start": 3.44718, "end": 5.99248}, {"text": "Is there anything that might help?", "start": 7.11482, "end": 8.71816}, {"text": "Could you explain how to use it safely?", "start": 10.43378, "end": 12.40921}]}, {"number": 58, "title": "醫生看診 · Visiting a Doctor", "audio": "learning/pel100/pel100-058.mp3?v=93f4e191d9711c67", "transcript": "I've been feeling tired for several days. I've also been having trouble sleeping. I'm not sure whether the two problems are related. I'd like to know what I should do next.", "sentence_cues": [{"text": "I've been feeling tired for several days.", "start": 0.42082, "end": 2.66521}, {"text": "I've also been having trouble sleeping.", "start": 3.80744, "end": 5.79131}, {"text": "I'm not sure whether the two problems are related.", "start": 6.67303, "end": 9.49855}, {"text": "I'd like to know what I should do next.", "start": 11.15455, "end": 12.96919}]}, {"number": 59, "title": "照顧寵物 · Taking Care of a Pet", "audio": "learning/pel100/pel100-059.mp3?v=b46184185d364f08", "transcript": "My cat usually eats twice a day. Recently, she has been eating less than usual. I've started keeping a record of her meals. I want to understand whether something has changed.", "sentence_cues": [{"text": "My cat usually eats twice a day.", "start": 0.48105, "end": 2.26497}, {"text": "Recently, she has been eating less than usual.", "start": 2.86629, "end": 5.67244}, {"text": "I've started keeping a record of her meals.", "start": 6.57442, "end": 8.85943}, {"text": "I want to understand whether something has changed.", "start": 10.23455, "end": 12.76964}]}, {"number": 60, "title": "天氣影響計畫 · Weather and Plans", "audio": "learning/pel100/pel100-060.mp3?v=5ca3760400b89d27", "transcript": "It was raining when I woke up. I had planned to ride my bike. Instead, I decided to stay home and read. Sometimes a change of plans can be relaxing.", "sentence_cues": [{"text": "It was raining when I woke up.", "start": 0.38091, "end": 1.82434}, {"text": "I had planned to ride my bike.", "start": 2.60621, "end": 4.31026}, {"text": "Instead, I decided to stay home and read.", "start": 5.17232, "end": 8.23962}, {"text": "Sometimes a change of plans can be relaxing.", "start": 9.15219, "end": 12.32945}]}, {"number": 61, "title": "第一份工作 · My First Job", "audio": "learning/pel100/pel100-061.mp3?v=40826b74e03cfd3f", "transcript": "I got my first job when I was twenty-two. At that time, I didn't know much about business. My manager taught me how to solve problems step by step. That experience helped me become more confident.", "sentence_cues": [{"text": "I got my first job when I was twenty-two.", "start": 0.40098, "end": 3.22791}, {"text": "At that time, I didn't know much about business.", "start": 5.17268, "end": 8.05975}, {"text": "My manager taught me how to solve problems step by step.", "start": 8.89095, "end": 12.41977}, {"text": "That experience helped me become more confident.", "start": 13.42228, "end": 16.3496}]}, {"number": 62, "title": "從錯誤中學習 · Learning From Mistakes", "audio": "learning/pel100/pel100-062.mp3?v=80a87fa572d2f6f8", "transcript": "I once made an important mistake at work. I didn't check the information carefully enough. After that, I started reviewing my work before sending it. I learned that small mistakes can have big consequences.", "sentence_cues": [{"text": "I once made an important mistake at work.", "start": 0.92217, "end": 3.48823}, {"text": "I didn't check the information carefully enough.", "start": 5.77362, "end": 8.31962}, {"text": "After that, I started reviewing my work before sending it.", "start": 9.37119, "end": 13.21963}, {"text": "I learned that small mistakes can have big consequences.", "start": 14.302, "end": 17.74956}]}, {"number": 63, "title": "面對失敗 · Dealing With Failure", "audio": "learning/pel100/pel100-063.mp3?v=3a13ecee121e6491", "transcript": "One of my projects failed a few years ago. We had a good idea, but we didn't understand the market well. Instead of giving up, we studied what went wrong. The experience changed how I approach new projects.", "sentence_cues": [{"text": "One of my projects failed a few years ago.", "start": 0.42107, "end": 2.86731}, {"text": "We had a good idea, but we didn't understand the market well.", "start": 3.64931, "end": 7.65954}, {"text": "Instead of giving up, we studied what went wrong.", "start": 8.55089, "end": 11.87913}, {"text": "The experience changed how I approach new projects.", "start": 12.88161, "end": 16.08955}]}, {"number": 64, "title": "計畫突然改變 · An Unexpected Change", "audio": "learning/pel100/pel100-064.mp3?v=73b42cffd8d81479", "transcript": "We were preparing for an important event when the speaker canceled. Everyone was worried because we had little time. We quickly found another speaker and changed the schedule. In the end, the event went better than we expected.", "sentence_cues": [{"text": "We were preparing for an important event when the speaker canceled.", "start": 1.22278, "end": 5.03144}, {"text": "Everyone was worried because we had little time.", "start": 5.95353, "end": 8.63964}, {"text": "We quickly found another speaker and changed the schedule.", "start": 9.53102, "end": 12.55916}, {"text": "In the end, the event went better than we expected.", "start": 13.58191, "end": 16.50978}]}, {"number": 65, "title": "最有成就感的事情 · A Personal Achievement", "audio": "learning/pel100/pel100-065.mp3?v=391bef7e1de526c3", "transcript": "Last year, I completed a project that had taken months of work. There were many problems along the way. My team kept working together until we solved them. I was proud of what we had achieved.", "sentence_cues": [{"text": "Last year, I completed a project that had taken months of work.", "start": 0.42105, "end": 4.67168}, {"text": "There were many problems along the way.", "start": 5.73434, "end": 7.77945}, {"text": "My team kept working together until we solved them.", "start": 8.85149, "end": 11.94069}, {"text": "I was proud of what we had achieved.", "start": 12.76313, "end": 14.98976}]}, {"number": 66, "title": "困難的選擇 · Making a Difficult Decision", "audio": "learning/pel100/pel100-066.mp3?v=960746b708633c26", "transcript": "I once had to choose between two job opportunities. One offered more money, while the other offered better learning opportunities. I thought carefully about my long-term goals. Finally, I chose the job where I could learn more.", "sentence_cues": [{"text": "I once had to choose between two job opportunities.", "start": 0.4812, "end": 3.26817}, {"text": "One offered more money, while the other offered better learning opportunities.", "start": 3.68922, "end": 7.81955}, {"text": "I thought carefully about my long-term goals.", "start": 8.81121, "end": 11.31781}, {"text": "Finally, I chose the job where I could learn more.", "start": 12.90198, "end": 15.86979}]}, {"number": 67, "title": "兩種工作方式 · Comparing Work Methods", "audio": "learning/pel100/pel100-067.mp3?v=ee5a8e3a8a98741e", "transcript": "Some people prefer working alone, while others enjoy teamwork. Working alone can help you focus. Teamwork allows people to share different ideas. I think the best choice depends on the task.", "sentence_cues": [{"text": "Some people prefer working alone, while others enjoy teamwork.", "start": 0.4612, "end": 4.27112}, {"text": "Working alone can help you focus.", "start": 5.31384, "end": 7.37922}, {"text": "Teamwork allows people to share different ideas.", "start": 8.33092, "end": 11.23979}, {"text": "I think the best choice depends on the task.", "start": 12.12248, "end": 14.48969}]}, {"number": 68, "title": "選擇工具 · Choosing the Right Tool", "audio": "learning/pel100/pel100-068.mp3?v=2819e3ad7269a9a0", "transcript": "There are many tools that can do similar things. The most expensive one isn't always the best. I usually compare cost, reliability, and ease of use. What matters most is whether the tool solves the real problem.", "sentence_cues": [{"text": "There are many tools that can do similar things.", "start": 0.32097, "end": 3.18961}, {"text": "The most expensive one isn't always the best.", "start": 3.651, "end": 6.4394}, {"text": "I usually compare cost, reliability, and ease of use.", "start": 7.451, "end": 11.15906}, {"text": "What matters most is whether the tool solves the real problem.", "start": 12.50198, "end": 16.12987}]}, {"number": 69, "title": "別人的建議 · Learning From Others", "audio": "learning/pel100/pel100-069.mp3?v=44096165e8f1ddb9", "transcript": "A friend once gave me advice about managing my time. At first, I didn't think it would help. However, I decided to try his method for a week. It worked better than I expected.", "sentence_cues": [{"text": "A friend once gave me advice about managing my time.", "start": 0.86229, "end": 4.09088}, {"text": "At first, I didn't think it would help.", "start": 5.03339, "end": 7.41973}, {"text": "However, I decided to try his method for a week.", "start": 8.53188, "end": 12.06191}, {"text": "It worked better than I expected.", "start": 13.00459, "end": 14.84983}]}, {"number": 70, "title": "遠端工作好不好 · Is Remote Work Better?", "audio": "learning/pel100/pel100-070.mp3?v=704271943d019ee7", "transcript": "Remote work gives people more flexibility. They can save time by avoiding long trips to the office. However, it can be harder to communicate with teammates. I believe a mix of remote and office work is often a good solution.", "sentence_cues": [{"text": "Remote work gives people more flexibility.", "start": 0.80193, "end": 3.52848}, {"text": "They can save time by avoiding long trips to the office.", "start": 4.61108, "end": 8.15961}, {"text": "However, it can be harder to communicate with teammates.", "start": 9.07084, "end": 12.3176}, {"text": "I believe a mix of remote and office work is often a good solution.", "start": 13.23952, "end": 17.64871}]}, {"number": 71, "title": "AI與學習 · AI and Learning", "audio": "learning/pel100/pel100-071.mp3?v=acc4e7c04688750c", "transcript": "AI has changed how people learn new skills. Students can now ask questions and get feedback quickly. However, getting an answer doesn't always mean understanding it. I think students still need to practice and explain things themselves.", "sentence_cues": [{"text": "AI has changed how people learn new skills.", "start": 0.66176, "end": 3.48928}, {"text": "Students can now ask questions and get feedback quickly.", "start": 4.2112, "end": 7.39968}, {"text": "However, getting an answer doesn't always mean understanding it.", "start": 8.33108, "end": 11.51852}, {"text": "I think students still need to practice and explain things themselves.", "start": 12.54091, "end": 16.10925}]}, {"number": 72, "title": "再生能源 · Renewable Energy", "audio": "learning/pel100/pel100-072.mp3?v=518117598a0d0774", "transcript": "Solar energy is becoming more common in many places. It can help reduce the use of fossil fuels. However, solar panels don't produce the same amount of electricity all day. That's why energy storage and better planning are important.", "sentence_cues": [{"text": "Solar energy is becoming more common in many places.", "start": 0.30083, "end": 3.71019}, {"text": "It can help reduce the use of fossil fuels.", "start": 4.53245, "end": 7.19978}, {"text": "However, solar panels don't produce the same amount of electricity all day.", "start": 8.15111, "end": 12.74092}, {"text": "That's why energy storage and better planning are important.", "start": 13.28208, "end": 16.64927}]}, {"number": 73, "title": "永續生活 · Living More Sustainably", "audio": "learning/pel100/pel100-073.mp3?v=23ea56a68276c15f", "transcript": "Many people want to reduce waste in their daily lives. Some bring reusable bags or avoid buying unnecessary things. These actions may seem small, but they can become good habits. I believe lasting change begins with simple decisions.", "sentence_cues": [{"text": "Many people want to reduce waste in their daily lives.", "start": 0.70149, "end": 3.70786}, {"text": "Some bring reusable bags or avoid buying unnecessary things.", "start": 4.83023, "end": 9.25962}, {"text": "These actions may seem small, but they can become good habits.", "start": 10.29115, "end": 13.77915}, {"text": "I believe lasting change begins with simple decisions.", "start": 14.98191, "end": 18.38972}]}, {"number": 74, "title": "城市與鄉村 · City Life or Country Life", "audio": "learning/pel100/pel100-074.mp3?v=c485577ff7543d39", "transcript": "Living in a city offers more job opportunities. Public transportation is also more convenient. On the other hand, the countryside is often quieter and less crowded. I'd prefer the city for work but the countryside for relaxation.", "sentence_cues": [{"text": "Living in a city offers more job opportunities.", "start": 0.48138, "end": 3.57026}, {"text": "Public transportation is also more convenient.", "start": 4.17199, "end": 6.77948}, {"text": "On the other hand, the countryside is often quieter and less crowded.", "start": 7.97126, "end": 12.31956}, {"text": "I'd prefer the city for work but the countryside for relaxation.", "start": 13.22128, "end": 17.12874}]}, {"number": 75, "title": "公共運輸 · Public Transportation", "audio": "learning/pel100/pel100-075.mp3?v=9a35cb5e1102c49c", "transcript": "I used to drive to work every day. Recently, I've started taking the train more often. It takes about the same amount of time, but I can read during the trip. As a result, my journey feels less stressful.", "sentence_cues": [{"text": "I used to drive to work every day.", "start": 0.56149, "end": 2.50667}, {"text": "Recently, I've started taking the train more often.", "start": 4.15104, "end": 7.39968}, {"text": "It takes about the same amount of time, but I can read during the trip.", "start": 8.23084, "end": 12.46063}, {"text": "As a result, my journey feels less stressful.", "start": 13.02193, "end": 16.32958}]}, {"number": 76, "title": "消費與儲蓄 · Spending and Saving", "audio": "learning/pel100/pel100-076.mp3?v=4173366852c537bf", "transcript": "I try to save part of my income every month. Before buying something expensive, I ask myself whether I really need it. Sometimes waiting a few days helps me make a better decision. I've learned that careful spending is more important than buying things quickly.", "sentence_cues": [{"text": "I try to save part of my income every month.", "start": 0.44111, "end": 2.92739}, {"text": "Before buying something expensive, I ask myself whether I really need it.", "start": 3.46876, "end": 7.85985}, {"text": "Sometimes waiting a few days helps me make a better decision.", "start": 8.87274, "end": 12.58963}, {"text": "I've learned that careful spending is more important than buying things quickly.", "start": 13.4417, "end": 17.85951}]}, {"number": 77, "title": "閱讀與思考 · Reading and Thinking", "audio": "learning/pel100/pel100-077.mp3?v=ced35e253e37777d", "transcript": "I recently read a book about decision-making. The author explained why people sometimes make poor choices. One idea was especially interesting to me. We should question our first impression before making important decisions.", "sentence_cues": [{"text": "I recently read a book about decision-making.", "start": 0.56129, "end": 3.40782}, {"text": "The author explained why people sometimes make poor choices.", "start": 3.88892, "end": 8.49949}, {"text": "One idea was especially interesting to me.", "start": 10.05217, "end": 12.49758}, {"text": "We should question our first impression before making important decisions.", "start": 13.62007, "end": 17.84942}]}, {"number": 78, "title": "難忘的旅行 · A Memorable Trip", "audio": "learning/pel100/pel100-078.mp3?v=428d3f90351fd89d", "transcript": "I visited Japan with my family a few years ago. We traveled through several cities and tried many local dishes. What impressed me most was how easy it was to use public transportation. I'd love to visit again someday.", "sentence_cues": [{"text": "I visited Japan with my family a few years ago.", "start": 0.50115, "end": 3.32763}, {"text": "We traveled through several cities and tried many local dishes.", "start": 4.34998, "end": 8.39926}, {"text": "What impressed me most was how easy it was to use public transportation.", "start": 9.87182, "end": 14.56248}, {"text": "I'd love to visit again someday.", "start": 15.78526, "end": 17.68959}]}, {"number": 79, "title": "文化差異 · Cultural Differences", "audio": "learning/pel100/pel100-079.mp3?v=d0776a46bcd851d7", "transcript": "People in different countries may communicate in different ways. In some cultures, being direct is considered helpful. In others, people prefer softer expressions. Understanding these differences can help us avoid misunderstandings.", "sentence_cues": [{"text": "People in different countries may communicate in different ways.", "start": 0.48117, "end": 3.84934}, {"text": "In some cultures, being direct is considered helpful.", "start": 4.4909, "end": 8.09966}, {"text": "In others, people prefer softer expressions.", "start": 8.93084, "end": 11.65752}, {"text": "Understanding these differences can help us avoid misunderstandings.", "start": 12.45948, "end": 16.46931}]}, {"number": 80, "title": "改變自己的想法 · Changing My Mind", "audio": "learning/pel100/pel100-080.mp3?v=cd3d9c4f35435431", "transcript": "I used to believe that working longer meant getting more done. Then I noticed that tired people often make more mistakes. I started focusing on results instead of working hours. Now I believe working smarter is more useful than simply working longer.", "sentence_cues": [{"text": "I used to believe that working longer meant getting more done.", "start": 0.74146, "end": 4.34856}, {"text": "Then I noticed that tired people often make more mistakes.", "start": 5.77136, "end": 9.05783}, {"text": "I started focusing on results instead of working hours.", "start": 11.15121, "end": 14.77808}, {"text": "Now I believe working smarter is more useful than simply working longer.", "start": 15.77998, "end": 20.24844}]}, {"number": 81, "title": "一分鐘自我介紹 · A Short Professional Introduction", "audio": "learning/pel100/pel100-081.mp3?v=7cac6e777a3ff479", "transcript": "I've been working in technology and business for several years. My main interest is using AI to solve practical problems. I enjoy turning new ideas into useful products. Today, I'd like to share one of the projects I'm working on.", "sentence_cues": [{"text": "I've been working in technology and business for several years.", "start": 0.58122, "end": 4.20884}, {"text": "My main interest is using AI to solve practical problems.", "start": 4.99048, "end": 8.95882}, {"text": "I enjoy turning new ideas into useful products.", "start": 10.95213, "end": 14.27868}, {"text": "Today, I'd like to share one of the projects I'm working on.", "start": 15.30069, "end": 19.08815}]}, {"number": 82, "title": "說明市場問題 · Explaining a Market Problem", "audio": "learning/pel100/pel100-082.mp3?v=4e3ce4d495dc07e7", "transcript": "Many small businesses want to use AI but don't know where to start. Existing solutions can be expensive or difficult to manage. As a result, some companies give up before seeing any benefits. We believe there is a better way to solve this problem.", "sentence_cues": [{"text": "Many small businesses want to use AI but don't know where to start.", "start": 1.20276, "end": 4.7509}, {"text": "Existing solutions can be expensive or difficult to manage.", "start": 5.27209, "end": 8.61977}, {"text": "As a result, some companies give up before seeing any benefits.", "start": 9.491, "end": 13.70103}, {"text": "We believe there is a better way to solve this problem.", "start": 14.66332, "end": 17.36976}]}, {"number": 83, "title": "訪談客戶 · Interviewing a Customer", "audio": "learning/pel100/pel100-083.mp3?v=27b7054edf45d35c", "transcript": "Before building our product, we talked to potential customers. We asked them about their daily work and biggest problems. Several people described the same difficulty. This helped us understand which problem we should solve first.", "sentence_cues": [{"text": "Before building our product, we talked to potential customers.", "start": 0.3207, "end": 3.94866}, {"text": "We asked them about their daily work and biggest problems.", "start": 5.23147, "end": 8.87947}, {"text": "Several people described the same difficulty.", "start": 10.03143, "end": 12.35737}, {"text": "This helped us understand which problem we should solve first.", "start": 13.13936, "end": 17.18969}]}, {"number": 84, "title": "最小可行產品 · Building a Simple First Version", "audio": "learning/pel100/pel100-084.mp3?v=e90ec240b0ff00dd", "transcript": "We don't need to build every feature at the beginning. Instead, we can start with a simple version of the product. This allows us to test whether customers actually need it. If the results are positive, we can add more features later.", "sentence_cues": [{"text": "We don't need to build every feature at the beginning.", "start": 0.42112, "end": 3.008}, {"text": "Instead, we can start with a simple version of the product.", "start": 3.66976, "end": 7.37963}, {"text": "This allows us to test whether customers actually need it.", "start": 8.65178, "end": 12.07957}, {"text": "If the results are positive, we can add more features later.", "start": 12.94153, "end": 16.60986}]}, {"number": 85, "title": "競爭優勢 · Explaining Our Advantage", "audio": "learning/pel100/pel100-085.mp3?v=79251adcae654595", "transcript": "There are already several products in this market. However, most of them require expensive equipment. Our solution uses simpler hardware and a flexible software system. This could make it easier for small companies to get started.", "sentence_cues": [{"text": "There are already several products in this market.", "start": 0.50136, "end": 3.24883}, {"text": "However, most of them require expensive equipment.", "start": 3.66997, "end": 7.23967}, {"text": "Our solution uses simpler hardware and a flexible software system.", "start": 8.23103, "end": 12.67986}, {"text": "This could make it easier for small companies to get started.", "start": 13.64177, "end": 17.02849}]}, {"number": 86, "title": "市場驗證 · Showing Early Results", "audio": "learning/pel100/pel100-086.mp3?v=bd72b066314bd76c", "transcript": "We tested our first product with a small group of users. Most of them were able to complete the main task. However, some users needed help during setup. We've used their feedback to improve the process.", "sentence_cues": [{"text": "We tested our first product with a small group of users.", "start": 0.52121, "end": 4.02933}, {"text": "Most of them were able to complete the main task.", "start": 5.67313, "end": 8.25912}, {"text": "However, some users needed help during setup.", "start": 9.57151, "end": 12.81997}, {"text": "We've used their feedback to improve the process.", "start": 13.74238, "end": 16.50958}]}, {"number": 87, "title": "商業模式 · Explaining How We Make Money", "audio": "learning/pel100/pel100-087.mp3?v=1f94592ff99079c6", "transcript": "Our customers pay a monthly fee to use the service. The price depends on how many devices they connect. This gives small companies a lower starting cost. As their needs grow, they can upgrade to a larger plan.", "sentence_cues": [{"text": "Our customers pay a monthly fee to use the service.", "start": 0.84188, "end": 4.18935}, {"text": "The price depends on how many devices they connect.", "start": 5.39204, "end": 8.51902}, {"text": "This gives small companies a lower starting cost.", "start": 9.69095, "end": 12.57817}, {"text": "As their needs grow, they can upgrade to a larger plan.", "start": 14.30248, "end": 17.12955}]}, {"number": 88, "title": "評估風險 · Understanding Business Risks", "audio": "learning/pel100/pel100-088.mp3?v=4e9cba7bf432e474", "transcript": "Every new business faces uncertainty. One major risk is that customers may not be willing to pay. To reduce this risk, we plan to test the pricing before expanding. We'd rather learn early than spend too much money on the wrong idea.", "sentence_cues": [{"text": "Every new business faces uncertainty.", "start": 0.56136, "end": 2.88701}, {"text": "One major risk is that customers may not be willing to pay.", "start": 4.21022, "end": 7.95932}, {"text": "To reduce this risk, we plan to test the pricing before expanding.", "start": 9.07103, "end": 13.01946}, {"text": "We'd rather learn early than spend too much money on the wrong idea.", "start": 14.24208, "end": 17.70949}]}, {"number": 89, "title": "長期願景 · Sharing a Long-Term Vision", "audio": "learning/pel100/pel100-089.mp3?v=baba49f64d34d509", "transcript": "Today, our product solves one specific problem. In the future, we hope to connect several related services. This would allow customers to manage their work more easily. Our long-term goal is to build a system that grows with their needs.", "sentence_cues": [{"text": "Today, our product solves one specific problem.", "start": 0.421, "end": 3.68878}, {"text": "In the future, we hope to connect several related services.", "start": 3.96945, "end": 8.29976}, {"text": "This would allow customers to manage their work more easily.", "start": 9.29124, "end": 12.61887}, {"text": "Our long-term goal is to build a system that grows with their needs.", "start": 13.5009, "end": 17.34972}]}, {"number": 90, "title": "資料隱私 · Protecting User Data", "audio": "learning/pel100/pel100-090.mp3?v=432b55a3d2993c8c", "transcript": "AI systems often need data to provide useful services. However, users should know what information is collected. They should also be able to control who can access it. We believe trust is essential for long-term success.", "sentence_cues": [{"text": "AI systems often need data to provide useful services.", "start": 0.48106, "end": 4.30953}, {"text": "However, users should know what information is collected.", "start": 4.93091, "end": 8.69925}, {"text": "They should also be able to control who can access it.", "start": 9.93131, "end": 12.73813}, {"text": "We believe trust is essential for long-term success.", "start": 13.90095, "end": 17.14883}]}, {"number": 91, "title": "介紹研究主題 · Introducing My Research", "audio": "learning/pel100/pel100-091.mp3?v=d8e6097aab0ba8a3", "transcript": "My research focuses on understanding electrical equipment through power data. We collect signals from a main electricity meter. Then we use AI models to identify different operating patterns. The goal is to understand equipment behavior without installing sensors on every machine.", "sentence_cues": [{"text": "My research focuses on understanding electrical equipment through power data.", "start": 0.42096, "end": 4.93121}, {"text": "We collect signals from a main electricity meter.", "start": 5.8533, "end": 8.65968}, {"text": "Then we use AI models to identify different operating patterns.", "start": 9.59181, "end": 13.84926}, {"text": "The goal is to understand equipment behavior without installing sensors on every machine.", "start": 14.78139, "end": 19.87909}]}, {"number": 92, "title": "提出研究假設 · Explaining a Hypothesis", "audio": "learning/pel100/pel100-092.mp3?v=f42211ca965fff87", "transcript": "We believe that electrical signals contain useful information about machine behavior. If we analyze them carefully, we may be able to identify unusual patterns. These patterns could help us detect problems earlier. Our next step is to test this idea with real data.", "sentence_cues": [{"text": "We believe that electrical signals contain useful information about machine behavior.", "start": 0.8427, "end": 6.15974}, {"text": "If we analyze them carefully, we may be able to identify unusual patterns.", "start": 7.09099, "end": 11.76018}, {"text": "These patterns could help us detect problems earlier.", "start": 12.70203, "end": 15.9885}, {"text": "Our next step is to test this idea with real data.", "start": 17.78311, "end": 21.2589}]}, {"number": 93, "title": "說明研究方法 · Explaining a Research Method", "audio": "learning/pel100/pel100-093.mp3?v=daab1bee3bd01b99", "transcript": "First, we collect electricity data from different machines. Next, we prepare the data and remove obvious errors. Then we train a model to recognize operating patterns. Finally, we evaluate how well the model works on unseen data.", "sentence_cues": [{"text": "First, we collect electricity data from different machines.", "start": 0.66153, "end": 4.16965}, {"text": "Next, we prepare the data and remove obvious errors.", "start": 5.05169, "end": 8.51972}, {"text": "Then we train a model to recognize operating patterns.", "start": 9.411, "end": 12.33797}, {"text": "Finally, we evaluate how well the model works on unseen data.", "start": 12.91936, "end": 17.02914}]}, {"number": 94, "title": "解釋意外的結果 · Explaining an Unexpected Result", "audio": "learning/pel100/pel100-094.mp3?v=8baa791bb7b78509", "transcript": "We expected the new model to perform better. However, the results were not as good as we hoped. After checking the data, we found differences between the training and testing conditions. This suggests that the model may need to be more reliable across environments.", "sentence_cues": [{"text": "We expected the new model to perform better.", "start": 0.46125, "end": 2.98812}, {"text": "However, the results were not as good as we hoped.", "start": 4.07106, "end": 7.21962}, {"text": "After checking the data, we found differences between the training and testing conditions.", "start": 8.55251, "end": 14.20934}, {"text": "This suggests that the model may need to be more reliable across environments.", "start": 15.14156, "end": 19.15887}]}, {"number": 95, "title": "研究限制 · Discussing Research Limitations", "audio": "learning/pel100/pel100-095.mp3?v=7d8dd0cf59b52c2d", "transcript": "Our results are promising, but the study has some limitations. We tested the model on only a few datasets. Therefore, we cannot assume it will work equally well everywhere. More experiments are needed before we can make a stronger claim.", "sentence_cues": [{"text": "Our results are promising, but the study has some limitations.", "start": 0.48115, "end": 3.9895}, {"text": "We tested the model on only a few datasets.", "start": 5.19236, "end": 8.05919}, {"text": "Therefore, we cannot assume it will work equally well everywhere.", "start": 9.13092, "end": 12.63944}, {"text": "More experiments are needed before we can make a stronger claim.", "start": 13.60178, "end": 16.82961}]}, {"number": 96, "title": "回答聽眾問題 · Answering a Difficult Question", "audio": "learning/pel100/pel100-096.mp3?v=08e909dec447d2de", "transcript": "Thank you for the question. That's an important point, and we haven't fully explored it yet. Based on our current results, we believe the method has potential. However, we need more evidence before reaching a final conclusion.", "sentence_cues": [{"text": "Thank you for the question.", "start": 0.44093, "end": 1.58333}, {"text": "That's an important point, and we haven't fully explored it yet.", "start": 4.85019, "end": 9.03899}, {"text": "Based on our current results, we believe the method has potential.", "start": 10.31099, "end": 14.09953}, {"text": "However, we need more evidence before reaching a final conclusion.", "start": 14.82115, "end": 18.56959}]}, {"number": 97, "title": "商業協商 · Negotiating a Deal", "audio": "learning/pel100/pel100-097.mp3?v=de51f00726b2ebab", "transcript": "We understand that the price is an important concern. However, we also need to maintain the quality of our service. If you can commit to a longer contract, we may be able to offer a discount. Would that be an acceptable option for your team?", "sentence_cues": [{"text": "We understand that the price is an important concern.", "start": 0.66148, "end": 3.86864}, {"text": "However, we also need to maintain the quality of our service.", "start": 4.40984, "end": 8.59919}, {"text": "If you can commit to a longer contract, we may be able to offer a discount.", "start": 9.9515, "end": 14.60237}, {"text": "Would that be an acceptable option for your team?", "start": 15.44433, "end": 17.72967}]}, {"number": 98, "title": "回應反對意見 · Responding to an Objection", "audio": "learning/pel100/pel100-098.mp3?v=b5aa8384a685db64", "transcript": "I understand your concern about the cost. However, we should also consider the time saved by automation. A lower purchase price doesn't always mean a lower total cost. That's why I suggest comparing the overall value rather than the initial price alone.", "sentence_cues": [{"text": "I understand your concern about the cost.", "start": 0.46127, "end": 2.66733}, {"text": "However, we should also consider the time saved by automation.", "start": 3.16871, "end": 6.97917}, {"text": "A lower purchase price doesn't always mean a lower total cost.", "start": 7.99185, "end": 11.42938}, {"text": "That's why I suggest comparing the overall value rather than the initial price alone.", "start": 12.28134, "end": 17.55993}]}, {"number": 99, "title": "情境推演 · Planning for Different Scenarios", "audio": "learning/pel100/pel100-099.mp3?v=f844caa8482f52f0", "transcript": "Let's consider three possible outcomes. If demand grows quickly, we'll need more resources. If growth is slower than expected, we can control costs and improve the product. By preparing for both situations, we can make better decisions.", "sentence_cues": [{"text": "Let's consider three possible outcomes.", "start": 0.46128, "end": 2.60724}, {"text": "If demand grows quickly, we'll need more resources.", "start": 3.44958, "end": 6.99944}, {"text": "If growth is slower than expected, we can control costs and improve the product.", "start": 7.89124, "end": 12.94956}, {"text": "By preparing for both situations, we can make better decisions.", "start": 13.88206, "end": 17.6991}]}, {"number": 100, "title": "總結與下一步 · Summarizing and Moving Forward", "audio": "learning/pel100/pel100-100.mp3?v=ae0e998da30e6083", "transcript": "Today, we've discussed the problem, our solution, and the early results. We still have challenges to solve, but we've made meaningful progress. Our next step is to test the system with more users. I believe that by learning from real experience, we can build something truly useful.", "sentence_cues": [{"text": "Today, we've discussed the problem, our solution, and the early results.", "start": 0.14056, "end": 4.75888}, {"text": "We still have challenges to solve, but we've made meaningful progress.", "start": 5.81095, "end": 9.69971}, {"text": "Our next step is to test the system with more users.", "start": 10.42133, "end": 13.84905}, {"text": "I believe that by learning from real experience, we can build something truly useful.", "start": 15.02157, "end": 19.55929}]}]}];
    const audio = document.querySelector('#practice-audio');
    const title = document.querySelector('#page-title');
    const number = document.querySelector('#page-number');
    const collectionTitle = document.querySelector('#collection-title');
    const transcript = document.querySelector('#transcript');
    const slideVisual = document.querySelector('#slide-visual');
    const slideLink = document.querySelector('#slide-link');
    const slideImage = document.querySelector('#slide-image');
    const slideCaption = document.querySelector('#slide-caption');
    const list = document.querySelector('#page-list');
    const select = document.querySelector('#page-select');
    const collectionSelect = document.querySelector('#collection-select');
    const speedButtons = [...document.querySelectorAll('.speed')];
    const repeatAll = document.querySelector('#repeat-all');
    const repeatPage = document.querySelector('#loop');
    const playerDesk = document.querySelector('#player-desk');
    const playerSentinel = document.querySelector('#player-sentinel');
    const previousItem = document.querySelector('#previous-item');
    const nextItem = document.querySelector('#next-item');
    const playerStatus = document.querySelector('#player-status');
    const installButton = document.querySelector('#install-app');
    const installStatus = document.querySelector('#install-status');
    const requestedCollection = decodeURIComponent(window.location.hash.slice(1));
    const requestedCollectionIndex = collections.findIndex(collection => collection.id === requestedCollection);
    let activeCollectionIndex = requestedCollectionIndex >= 0 ? requestedCollectionIndex : 0;
    let activeIndex = 0;
    let speed = 1;
    let installPrompt = null;

    const sentenceSegmenter = typeof Intl.Segmenter === 'function'
      ? new Intl.Segmenter('en', {granularity: 'sentence'})
      : null;
    const sentenceParts = text => {
      if (sentenceSegmenter) {
        const segments = [...sentenceSegmenter.segment(text)]
          .map(item => item.segment.trim())
          .filter(Boolean);
        if (segments.length) return segments;
      }
      return text.match(/.*?(?:[.!?](?=\s+[A-Z]|$)|$)/g)?.map(item => item.trim()).filter(Boolean) || [text];
    };

    const speechUnits = sentence => {
      const tokens = sentence.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*|\d+(?:\.\d+)?%?/g) || [];
      return Math.max(1, tokens.reduce((total, token) => {
        if (/^\d/.test(token)) {
          const digits = (token.match(/\d/g) || []).length;
          return total + digits + (token.includes('.') ? 1 : 0) + (token.endsWith('%') ? 1 : 0);
        }
        if (/^[A-Z]{2,}$/.test(token)) return total + token.length;
        const syllableLikeGroups = token.toLowerCase().match(/[aeiouy]+/g)?.length || 1;
        return total + Math.max(1, syllableLikeGroups);
      }, 0));
    };

    let stickyFrame = 0;
    let sentenceWeights = [];
    let sentenceCues = [];
    let highlightEnabled = true;
    let totalSentenceWeight = 0;
    let activeSentenceIndex = -1;

    function updateStickyPlayer() {
      const stickyTop = parseFloat(getComputedStyle(playerDesk).top) || 0;
      const compactOffset = playerDesk.classList.contains('is-stuck') ? 108 : 48;
      const compactEdge = stickyTop + compactOffset;
      const isStuck = playerSentinel.getBoundingClientRect().top <= compactEdge;
      playerDesk.classList.toggle('is-stuck', isStuck);
    }

    function queueStickyUpdate() {
      if (stickyFrame) return;
      stickyFrame = requestAnimationFrame(() => {
        stickyFrame = 0;
        updateStickyPlayer();
      });
    }

    window.addEventListener('scroll', queueStickyUpdate, {passive: true});
    window.addEventListener('resize', queueStickyUpdate, {passive: true});
    updateStickyPlayer();

    function renderTranscript(text, cues = []) {
      sentenceCues = cues;
      const sentences = cues.length ? cues.map(cue => cue.text) : sentenceParts(text);
      sentenceWeights = sentences.map(speechUnits);
      totalSentenceWeight = sentenceWeights.reduce((total, weight) => total + weight, 0);
      activeSentenceIndex = -1;
      transcript.replaceChildren(...sentences.map(sentence => {
        const span = document.createElement('span');
        span.className = 'sentence';
        span.textContent = sentence.trim();
        return span;
      }));
    }

    function setActiveSentence(index) {
      if (index === activeSentenceIndex) return;
      transcript.querySelectorAll('.sentence').forEach((sentence, sentenceIndex) => {
        sentence.classList.toggle('is-speaking', sentenceIndex === index);
      });
      activeSentenceIndex = index;
    }

    function timedSentenceIndex(cues, currentTime) {
      // currentTime is media time: do not multiply by playbackRate.
      return cues.findIndex(cue => currentTime >= cue.start && currentTime < cue.end);
    }

    function updateSentenceHighlight() {
      if (!highlightEnabled) {
        setActiveSentence(-1);
        return;
      }
      if (sentenceCues.length) {
        const ready = Number.isFinite(audio.duration) && audio.duration > 0;
        setActiveSentence(!ready || audio.ended || (audio.paused && audio.currentTime <= 0)
          ? -1 : timedSentenceIndex(sentenceCues, audio.currentTime));
        return;
      }
      if (!Number.isFinite(audio.duration) || audio.duration <= 0 || totalSentenceWeight <= 0) {
        setActiveSentence(-1);
        return;
      }
      if (audio.paused && audio.currentTime <= 0) {
        setActiveSentence(-1);
        return;
      }
      const progress = Math.min(Math.max(audio.currentTime / audio.duration, 0), 0.999999);
      const targetWeight = progress * totalSentenceWeight;
      let cumulativeWeight = 0;
      let sentenceIndex = sentenceWeights.length - 1;
      for (let index = 0; index < sentenceWeights.length; index += 1) {
        cumulativeWeight += sentenceWeights[index];
        if (targetWeight < cumulativeWeight) {
          sentenceIndex = index;
          break;
        }
      }
      setActiveSentence(sentenceIndex);
    }

    function activeItems() {
      return collections[activeCollectionIndex].items;
    }

    function loadItem(index, shouldFocus = false) {
      activeIndex = index;
      const item = activeItems()[index];
      audio.pause();
      setActiveSentence(-1);
      audio.src = item.audio;
      audio.playbackRate = speed;
      highlightEnabled = item.highlight !== false;
      playerStatus.textContent = highlightEnabled ? '' : '此段顯示發音重點清單，不逐句高亮。';
      number.textContent = String(item.number).padStart(2, '0');
      collectionTitle.textContent = collections[activeCollectionIndex].title;
      title.textContent = item.title;
      if (item.slide_image) {
        slideImage.src = item.slide_image;
        slideImage.alt = `投影片 ${item.number}：${item.title}`;
        slideLink.href = item.slide_image;
        slideCaption.textContent = `投影片 ${item.number}／${activeItems().length} · 點選圖片放大`;
        slideVisual.hidden = false;
      } else {
        slideVisual.hidden = true;
        slideImage.removeAttribute('src');
        slideImage.alt = '';
        slideLink.removeAttribute('href');
      }
      renderTranscript(item.transcript, item.sentence_cues || []);
      select.value = String(index);
      document.querySelectorAll('.page-button').forEach((button, buttonIndex) => {
        button.setAttribute('aria-current', buttonIndex === index ? 'true' : 'false');
      });
      previousItem.disabled = activeIndex === 0;
      nextItem.disabled = activeIndex === activeItems().length - 1;
      if (shouldFocus) title.scrollIntoView({behavior: 'smooth', block: 'start'});
    }

    function renderItemList() {
      select.replaceChildren();
      list.replaceChildren();
      activeItems().forEach((item, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${String(item.number).padStart(2, '0')} · ${item.title}`;
        select.append(option);

        const listItem = document.createElement('li');
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'page-button';
        button.innerHTML = `<span class="number">${String(item.number).padStart(2, '0')}</span><span></span>`;
        button.lastElementChild.textContent = item.title;
        button.addEventListener('click', () => loadItem(index, true));
        listItem.append(button);
        list.append(listItem);
      });
    }

    collections.forEach((collection, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = `${collection.title} · ${collection.items.length}`;
      collectionSelect.append(option);
    });

    collectionSelect.addEventListener('change', event => {
      activeCollectionIndex = Number(event.target.value);
      window.history.replaceState(null, '', `#${collections[activeCollectionIndex].id}`);
      renderItemList();
      loadItem(0);
    });
    select.addEventListener('change', event => loadItem(Number(event.target.value)));
    previousItem.addEventListener('click', () => {
      if (activeIndex > 0) loadItem(activeIndex - 1, true);
    });
    nextItem.addEventListener('click', () => {
      if (activeIndex < activeItems().length - 1) loadItem(activeIndex + 1, true);
    });
    document.querySelector('#rewind').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 5); });
    audio.addEventListener('loadedmetadata', updateSentenceHighlight);
    audio.addEventListener('timeupdate', updateSentenceHighlight);
    audio.addEventListener('play', updateSentenceHighlight);
    audio.addEventListener('seeking', updateSentenceHighlight);
    audio.addEventListener('seeked', updateSentenceHighlight);
    audio.addEventListener('ratechange', updateSentenceHighlight);
    repeatPage.addEventListener('change', event => {
      audio.loop = event.target.checked;
      if (event.target.checked) repeatAll.setAttribute('aria-pressed', 'false');
    });
    repeatAll.addEventListener('click', () => {
      const enabled = repeatAll.getAttribute('aria-pressed') !== 'true';
      repeatAll.setAttribute('aria-pressed', enabled ? 'true' : 'false');
      if (enabled) {
        repeatPage.checked = false;
        audio.loop = false;
      }
    });
    audio.addEventListener('ended', () => {
      setActiveSentence(-1);
      if (repeatAll.getAttribute('aria-pressed') !== 'true') return;
      loadItem((activeIndex + 1) % activeItems().length);
      audio.play().catch(error => {
        console.error('Repeat All playback was interrupted', error);
        playerStatus.textContent = '瀏覽器暫停了連續播放，請按播放繼續。';
      });
    });
    speedButtons.forEach(button => button.addEventListener('click', () => {
      speed = Number(button.dataset.speed);
      audio.playbackRate = speed;
      speedButtons.forEach(item => item.setAttribute('aria-pressed', item === button ? 'true' : 'false'));
    }));
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      installPrompt = event;
      installStatus.textContent = '已可安裝，點擊按鈕後確認即可。';
    });
    installButton.addEventListener('click', async () => {
      if (window.matchMedia('(display-mode: standalone)').matches) {
        installStatus.textContent = '這個練習頁已經安裝在裝置上。';
        return;
      }
      if (!installPrompt) {
        installStatus.textContent = '若未出現安裝視窗，請重新整理一次，或從 Chrome 選單選擇「安裝應用程式」。';
        return;
      }
      installPrompt.prompt();
      const choice = await installPrompt.userChoice;
      installStatus.textContent = choice.outcome === 'accepted' ? '安裝完成，可從手機桌面開啟。' : '尚未安裝，你可以稍後再試。';
      installPrompt = null;
    });
    window.addEventListener('appinstalled', () => {
      installButton.hidden = true;
      installStatus.textContent = '安裝完成，可從手機桌面開啟。';
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(error => {
          console.error('Service worker registration failed', error);
          installStatus.textContent = '安裝元件載入失敗，請重新整理後再試。';
        });
      });
    }
    document.addEventListener('keydown', event => {
      if (['INPUT', 'SELECT', 'BUTTON'].includes(document.activeElement.tagName)) return;
      if (event.code === 'Space') { event.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
      if (event.key === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
      if (event.key === 'ArrowRight') audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + 5);
    });

    collectionSelect.value = String(activeCollectionIndex);
    renderItemList();
    loadItem(0);
  </script>
</body>
</html>
