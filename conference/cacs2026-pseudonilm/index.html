<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173a42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shadow">
  <link rel="manifest" href="manifest.webmanifest?v=24">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Personal English Loop</title>
  <style>
    :root {
      color-scheme: light;
      --ink: oklch(25% 0.035 215);
      --muted: oklch(48% 0.035 215);
      --paper: oklch(96% 0.018 78);
      --paper-deep: oklch(91% 0.025 78);
      --teal: oklch(37% 0.075 205);
      --orange: oklch(68% 0.15 48);
      --line: oklch(82% 0.035 78);
      --focus: oklch(55% 0.13 205);
      --display: "Avenir Next", Avenir, "Trebuchet MS", sans-serif;
      --reading: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--paper-deep); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(90deg, var(--teal) 0 0.72rem, transparent 0.72rem),
        repeating-linear-gradient(0deg, transparent 0 2.95rem, color-mix(in oklch, var(--line), transparent 65%) 2.95rem 3rem),
        var(--paper);
      font-family: var(--display);
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1.75rem, env(safe-area-inset-left));
    }

    button, select, audio { font: inherit; }
    button:focus-visible, select:focus-visible, audio:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .shell { width: min(76rem, 100%); margin: 0 auto; }
    header {
      display: grid;
      gap: 0.4rem;
      padding: clamp(1rem, 3vw, 2.5rem) 0 clamp(1.5rem, 4vw, 3rem);
      border-bottom: 2px solid var(--ink);
    }
    .eyebrow {
      color: var(--teal);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      max-width: 18ch;
      font-size: clamp(2rem, 7vw, 5.2rem);
      font-weight: 650;
      letter-spacing: -0.055em;
      line-height: 0.98;
    }
    .lede { margin: 0.7rem 0 0; color: var(--muted); font-size: 1rem; }
    :is(h1, h2, p, .page-button) { text-wrap: pretty; overflow-wrap: break-word; }
    .install-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin-top: 0.8rem; }
    .install-button {
      min-height: 2.75rem;
      padding: 0.62rem 1rem;
      border: 1px solid var(--teal);
      border-radius: 999px;
      color: var(--paper);
      background: var(--teal);
      font-weight: 700;
      cursor: pointer;
    }
    .install-button:active { transform: translateY(1px); }
    .install-status { margin: 0; max-width: 48ch; color: var(--muted); font-size: 0.88rem; line-height: 1.55; }

    .workspace { display: grid; gap: 2rem; padding-top: clamp(1.5rem, 4vw, 3rem); }
    nav { min-width: 0; }
    .select-label { display: grid; gap: 0.35rem; margin-bottom: 0.85rem; color: var(--muted); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; }
    .collection-select, .mobile-select { width: 100%; min-height: 3rem; padding: 0.65rem 0.8rem; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); }
    .page-list { display: none; list-style: none; margin: 0; padding: 0; }
    .page-button {
      width: 100%;
      display: grid;
      grid-template-columns: 2.2rem 1fr;
      gap: 0.6rem;
      min-height: 3.2rem;
      padding: 0.7rem 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      text-align: left;
      cursor: pointer;
    }
    .page-button[aria-current="true"] { color: var(--ink); font-weight: 650; }
    .page-button[aria-current="true"] .number { color: var(--orange); }
    .number { font-variant-numeric: tabular-nums; font-weight: 750; }

    main { min-width: 0; }
    .page-meta { display: flex; align-items: baseline; gap: 0.7rem; color: var(--teal); }
    .page-meta span { font-weight: 750; font-variant-numeric: tabular-nums; }
    h2 { margin: 0.4rem 0 1.5rem; font-size: clamp(1.55rem, 4vw, 2.8rem); line-height: 1.12; letter-spacing: -0.035em; }

    .player-desk {
      position: sticky;
      top: 0.75rem;
      z-index: 2;
      display: grid;
      gap: 0.8rem;
      padding: 1rem;
      color: var(--paper);
      background: var(--ink);
      border-radius: 0.2rem;
      box-shadow: 0 0.8rem 2.5rem color-mix(in oklch, var(--ink), transparent 78%);
    }
    .player-sentinel { height: 1px; margin-bottom: -1px; pointer-events: none; }
    audio { width: 100%; min-height: 3.2rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 0.55rem; align-items: center; }
    .controls button, .loop-label {
      min-height: 2.75rem;
      padding: 0.55rem 0.8rem;
      border: 1px solid color-mix(in oklch, var(--paper), transparent 56%);
      border-radius: 999px;
      color: inherit;
      background: transparent;
    }
    .controls button { cursor: pointer; }
    .controls button[aria-pressed="true"] { color: var(--ink); background: var(--orange); border-color: var(--orange); }
    .loop-label { display: inline-flex; align-items: center; gap: 0.45rem; margin-left: auto; }
    .status { grid-column: 1 / -1; margin: 0; color: color-mix(in oklch, var(--paper), transparent 25%); font-size: 0.82rem; line-height: 1.4; }
    .player-desk.is-stuck {
      grid-template-columns: minmax(0, 1fr);
      gap: 0.35rem;
      padding: 0.45rem 0.55rem;
      box-shadow: 0 0.4rem 1.25rem color-mix(in oklch, var(--ink), transparent 72%);
    }
    .player-desk.is-stuck audio { min-height: 2.75rem; height: 2.75rem; }
    .player-desk.is-stuck .controls {
      flex-wrap: nowrap;
      gap: 0.35rem;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scrollbar-width: none;
    }
    .player-desk.is-stuck .controls::-webkit-scrollbar { display: none; }
    .player-desk.is-stuck .controls button,
    .player-desk.is-stuck .loop-label {
      flex: 0 0 auto;
      min-height: 2.75rem;
      padding: 0.3rem 0.55rem;
      font-size: 0.78rem;
    }
    .player-desk.is-stuck .loop-label { margin-left: 0; }
    .player-desk.is-stuck .status:empty { display: none; }

    .transcript {
      margin: 0;
      max-width: 67ch;
      font-family: var(--reading);
      font-size: clamp(1.22rem, 2.2vw, 1.58rem);
      line-height: 1.78;
      letter-spacing: 0.006em;
    }
    .sentence {
      display: inline;
      padding: 0 0.08em;
      border-radius: 0.16em;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    .sentence.is-speaking {
      color: var(--ink);
      background: color-mix(in oklch, var(--orange), var(--paper) 38%);
    }
    .sentence::after { content: " "; }
    .study-stage { display: grid; gap: clamp(1.5rem, 4vw, 3rem); margin-top: clamp(2rem, 5vw, 4rem); align-items: start; }
    .slide-visual { margin: 0; min-width: 0; }
    .slide-link {
      display: block;
      overflow: hidden;
      border: 1px solid var(--line);
      background: color-mix(in oklch, var(--ink), transparent 4%);
      box-shadow: 0 1rem 2.5rem color-mix(in oklch, var(--ink), transparent 84%);
    }
    .slide-link:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    .slide-image { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: contain; }
    .slide-caption { margin-top: 0.65rem; color: var(--muted); font-size: 0.84rem; line-height: 1.5; }
    .page-navigation {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    }
    .page-navigation button {
      min-height: 3.5rem;
      padding: 0.8rem 1rem;
      border: 1px solid var(--teal);
      color: var(--paper);
      background: var(--teal);
      font-weight: 750;
      cursor: pointer;
    }
    .page-navigation button:last-child { background: var(--ink); border-color: var(--ink); }
    .page-navigation button:active:not(:disabled) { transform: translateY(1px); }
    .page-navigation button:disabled {
      color: color-mix(in oklch, var(--muted), transparent 20%);
      background: color-mix(in oklch, var(--paper-deep), transparent 12%);
      border-color: var(--line);
      cursor: not-allowed;
    }

    @media (min-width: 48rem) {
      body { padding-left: max(2.5rem, env(safe-area-inset-left)); }
      .workspace { grid-template-columns: minmax(13rem, 0.68fr) minmax(0, 2fr); align-items: start; gap: clamp(2rem, 6vw, 6rem); }
      nav { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow: auto; }
      .mobile-select { display: none; }
      .page-list { display: block; }
      .player-desk { grid-template-columns: minmax(16rem, 1fr) auto; align-items: center; }
      .player-desk.is-stuck { grid-template-columns: minmax(12rem, 1fr) minmax(0, 1.15fr); }
      .controls { justify-content: flex-end; }
    }

    @media (min-width: 68rem) {
      .study-stage:has(.slide-visual:not([hidden])) { grid-template-columns: minmax(0, 1.35fr) minmax(18rem, 0.85fr); }
      .study-stage:has(.slide-visual:not([hidden])) .transcript { font-size: clamp(1.08rem, 1.45vw, 1.38rem); line-height: 1.68; }
      .page-navigation { grid-template-columns: repeat(2, minmax(12rem, 16rem)); justify-content: space-between; }
    }

    @media (hover: hover) {
      .page-button:hover { color: var(--ink); transform: translateX(0.18rem); }
      .controls button:hover { border-color: var(--orange); }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="eyebrow">Personal English Loop · practice desk</div>
      <h1>Listen. Read. Shadow.</h1>
      <p class="lede">選擇分類與教材，讓音檔與英文逐字稿保持在同一個畫面。</p>
      <div class="install-row">
        <button id="install-app" class="install-button" type="button" aria-describedby="install-status">安裝到手機</button>
        <p id="install-status" class="install-status" aria-live="polite">安裝後可從手機桌面直接開啟。</p>
      </div>
    </header>

    <div class="workspace">
      <nav aria-label="教材清單">
        <label class="select-label">練習分類
          <select id="collection-select" class="collection-select" aria-label="選擇練習分類"></select>
        </label>
        <select id="page-select" class="mobile-select" aria-label="選擇教材"></select>
        <ol id="page-list" class="page-list"></ol>
      </nav>

      <main id="main-content">
        <div class="page-meta"><span id="page-number">01</span><small id="collection-title">教材</small></div>
        <h2 id="page-title"></h2>

        <div id="player-sentinel" class="player-sentinel" aria-hidden="true"></div>
        <section id="player-desk" class="player-desk" aria-label="Shadowing 播放控制">
          <audio id="practice-audio" controls preload="metadata"></audio>
          <div class="controls">
            <button id="rewind" type="button" title="倒退五秒">↶ 5 秒</button>
            <button class="speed" type="button" data-speed="0.8">0.8×</button>
            <button class="speed" type="button" data-speed="0.9">0.9×</button>
            <button class="speed" type="button" data-speed="1" aria-pressed="true">1×</button>
            <button id="repeat-all" type="button" aria-pressed="false">Repeat All</button>
            <label class="loop-label"><input id="loop" type="checkbox"> 重複本頁</label>
          </div>
          <p id="player-status" class="status" aria-live="polite"></p>
        </section>

        <div class="study-stage">
          <figure id="slide-visual" class="slide-visual" hidden>
            <a id="slide-link" class="slide-link" target="_blank" rel="noopener" aria-label="在新分頁放大目前投影片">
              <img id="slide-image" class="slide-image" width="1600" height="900" decoding="async" alt="">
            </a>
            <figcaption id="slide-caption" class="slide-caption">點選投影片可在新分頁放大</figcaption>
          </figure>
          <article id="transcript" class="transcript" aria-live="polite"></article>
        </div>
        <nav class="page-navigation" aria-label="講稿換頁">
          <button id="previous-item" type="button" disabled>← 上一頁</button>
          <button id="next-item" type="button">下一頁 →</button>
        </nav>
      </main>
    </div>
  </div>

  <script>
    const collections = [{"id": "automation-2026", "title": "Automation 2026 講稿", "items": [{"number": 1, "title": "Engineering Bounds Constrain Candidate Selection in Industrial NILM", "audio": "automation2026/slide-01-engineering-bounds-constrain-candidate-selection-in-industri.mp3?v=49821402352a2b5b", "transcript": "Good morning. I am Chung-Kuang Chen from National Taiwan University of Science and Technology. In industrial non-intrusive load monitoring, calibration labels are often scarce. We ask whether an LLM proposes more useful calibration candidates than structured sampling under a small evaluation budget, and how engineering bounds change the answer. Our result is conditional: the relative advantage depends on bounds and on how performance is summarized.", "sentence_cues": [{"text": "Good morning.", "start": 0.0, "end": 0.52165}, {"text": "I am Chung-Kuang Chen from National Taiwan University of Science and Technology.", "start": 1.24394, "end": 5.91873}, {"text": "In industrial non-intrusive load monitoring, calibration labels are often scarce.", "start": 7.61259, "end": 13.82967}, {"text": "We ask whether an LLM proposes more useful calibration candidates than structured sampling under a small evaluation budget, and how engineering bounds change the answer.", "start": 14.86098, "end": 28.96946}, {"text": "Our result is conditional: the relative advantage depends on bounds and on how performance is summarized.", "start": 30.00132, "end": 37.89864}], "slide_image": "automation2026/slides/slide-1.png"}, {"number": 2, "title": "Industrial NILM calibration", "audio": "automation2026/slide-02-industrial-nilm-calibration.mp3?v=e92045fe936bec9b", "transcript": "Industrial NILM estimates individual device states from an aggregate power trace. In a new site, device-level labels may be unavailable during calibration. We therefore have to select parameters using aggregate data alone. Those parameters control such things as power thresholds and the reconstruction of each device's signal. A configuration that looks plausible by engineering intuition can still perform poorly on labeled device states. This makes candidate generation and candidate selection separate problems. Our experiment keeps the selection rule fixed and compares two ways to supply it with candidate configurations.", "sentence_cues": [{"text": "Industrial NILM estimates individual device states from an aggregate power trace.", "start": 0.76189, "end": 7.35821}, {"text": "In a new site, device-level labels may be unavailable during calibration.", "start": 8.93104, "end": 13.26006}, {"text": "We therefore have to select parameters using aggregate data alone.", "start": 14.04169, "end": 17.82958}, {"text": "Those parameters control such things as power thresholds and the reconstruction of each device's signal.", "start": 18.8614, "end": 25.15971}, {"text": "A configuration that looks plausible by engineering intuition can still perform poorly on labeled device states.", "start": 26.05113, "end": 33.24949}, {"text": "This makes candidate generation and candidate selection separate problems.", "start": 34.22173, "end": 38.55951}, {"text": "Our experiment keeps the selection rule fixed and compares two ways to supply it with candidate configurations.", "start": 40.0322, "end": 47.78921}], "slide_image": "automation2026/slides/slide-2.png"}, {"number": 3, "title": "Three corpora · nine devices", "audio": "automation2026/slide-03-three-corpora-nine-devices.mp3?v=f8ae9bb0c0413b29", "transcript": "We used 3 industrial corpora: IMDELD, Case 1, and WELTRON, with 9 devices in total. Each trace was aligned to 1 power sample per second. We split the data in time order. The first 50% is for calibration. The next 20% is for validation. The last 30% is for testing. The table shows four conditions: LLM wide, LLM bounded, LHS wide, and LHS bounded. LHS means Latin hypercube sampling. Each pool contained 15 joint configurations for each dataset, source, bounds condition, and seed. For the LLM, device proposals were joined by index, rather than by every possible combination. Both sources received the same candidate-count and calibration-sample budgets.", "sentence_cues": [{"text": "We used 3 industrial corpora: IMDELD, Case 1, and WELTRON, with 9 devices in total.", "start": 0.42096, "end": 8.69977}, {"text": "Each trace was aligned to 1 power sample per second.", "start": 9.59082, "end": 12.93707}, {"text": "We split the data in time order.", "start": 13.79867, "end": 15.92264}, {"text": "The first 50% is for calibration.", "start": 16.50372, "end": 19.34903}, {"text": "The next 20% is for validation.", "start": 20.6616, "end": 22.72909}, {"text": "The last 30% is for testing.", "start": 23.57215, "end": 25.61956}, {"text": "The table shows four conditions: LLM wide, LLM bounded, LHS wide, and LHS bounded.", "start": 26.39065, "end": 35.2297}, {"text": "LHS means Latin hypercube sampling.", "start": 36.12201, "end": 39.5994}, {"text": "Each pool contained 15 joint configurations for each dataset, source, bounds condition, and seed.", "start": 40.55125, "end": 47.64974}, {"text": "For the LLM, device proposals were joined by index, rather than by every possible combination.", "start": 48.52069, "end": 56.53378}, {"text": "Both sources received the same candidate-count and calibration-sample budgets.", "start": 61.01104, "end": 66.60922}], "slide_image": "automation2026/slides/slide-3.png"}, {"number": 4, "title": "Common aggregate-only selector", "audio": "automation2026/slide-04-common-aggregate-only-selector.mp3?v=f7c8a5e845e7b001", "transcript": "First, we form the LLM and LHS candidate pools. The same selector then ranks every pool using aggregate data only. The formula on the right combines residual fit, event agreement, state consistency, and separation. Their weights are 0.35, 0.30, 0.20, and 0.15. No device-level labels enter selection. We freeze the selected configuration first, and only then evaluate it with test labels. Candidate-count and calibration-sample budgets are equal. Generation information differs: the LLM also sees device information, aggregate statistics, and the scorer description. LHS uses the parameter ranges and a seed. Generation time and cost are not matched.", "sentence_cues": [{"text": "First, we form the LLM and LHS candidate pools.", "start": 0.28052, "end": 6.2115}, {"text": "The same selector then ranks every pool using aggregate data only.", "start": 6.59221, "end": 10.31911}, {"text": "The formula on the right combines residual fit, event agreement, state consistency, and separation.", "start": 11.57107, "end": 18.86969}, {"text": "Their weights are 0.35, 0.30, 0.20, and 0.15.", "start": 19.70092, "end": 26.79903}, {"text": "No device-level labels enter selection.", "start": 27.9508, "end": 30.31532}, {"text": "We freeze the selected configuration first, and only then evaluate it with test labels.", "start": 31.27715, "end": 37.3287}, {"text": "Candidate-count and calibration-sample budgets are equal.", "start": 38.82218, "end": 42.49953}, {"text": "Generation information differs: the LLM also sees device information, aggregate statistics, and the scorer description.", "start": 43.35075, "end": 53.42955}, {"text": "LHS uses the parameter ranges and a seed.", "start": 54.66146, "end": 57.68834}, {"text": "Generation time and cost are not matched.", "start": 60.27421, "end": 62.67968}], "slide_image": "automation2026/slides/slide-4.png"}, {"number": 5, "title": "Bounds change two parts of the procedure", "audio": "automation2026/slide-05-bounds-change-two-parts-of-the-procedure.mp3?v=18976fd3f5fd7014", "transcript": "Here, bounds are declared engineering ranges. Examples include power factor and on-ratio. The table shows two places where bounds act. First, they restrict candidate parameters. Bounded LHS samples directly within the ranges, without clipping or rejecting wide samples. Second, bounds restrict accepted events and cap reconstructed device power. The wide procedure keeps wider candidate ranges and wider reconstruction rules. So enabling bounds changes both candidate generation and reconstruction. If performance changes, this experiment cannot tell us how much comes from each part. Also, these declared ranges are engineering assumptions. We have not measured the true feasible region.", "sentence_cues": [{"text": "Here, bounds are declared engineering ranges.", "start": 0.46085, "end": 3.02556}, {"text": "Examples include power factor and on-ratio.", "start": 3.86711, "end": 6.89267}, {"text": "The table shows two places where bounds act.", "start": 7.91455, "end": 10.35904}, {"text": "First, they restrict candidate parameters.", "start": 11.61252, "end": 14.14921}, {"text": "Bounded LHS samples directly within the ranges, without clipping or rejecting wide samples.", "start": 15.08119, "end": 22.21959}, {"text": "Second, bounds restrict accepted events and cap reconstructed device power.", "start": 23.23179, "end": 28.22964}, {"text": "The wide procedure keeps wider candidate ranges and wider reconstruction rules.", "start": 29.20176, "end": 34.21871}, {"text": "So enabling bounds changes both candidate generation and reconstruction.", "start": 35.3714, "end": 40.68913}, {"text": "If performance changes, this experiment cannot tell us how much comes from each part.", "start": 41.82181, "end": 46.93958}, {"text": "Also, these declared ranges are engineering assumptions.", "start": 47.95133, "end": 51.31958}, {"text": "We have not measured the true feasible region.", "start": 52.36214, "end": 55.20912}], "slide_image": "automation2026/slides/slide-5.png"}, {"number": 6, "title": "Primary outcome: device-balanced MCC", "audio": "automation2026/slide-06-primary-outcome-device-balanced-mcc.mp3?v=8f4f9df8aa520183", "transcript": "Our primary outcome is load-state detection. MCC stands for Matthews correlation coefficient. For each device, we compare predicted on and off states with test labels. We count true positives, true negatives, false positives, and false negatives, then calculate one MCC for that device. To calculate macro MCC, we add the 9 MCC scores and divide by 9. Each device receives equal weight, regardless of its duration or power rating. We average device scores rather than combine all devices into one confusion matrix. This test metric is separate from the aggregate-only selection score. We use test labels only after selection is locked. Event F-one is secondary.", "sentence_cues": [{"text": "Our primary outcome is load-state detection.", "start": 0.40093, "end": 3.10719}, {"text": "MCC stands for Matthews correlation coefficient.", "start": 4.41021, "end": 8.19898}, {"text": "For each device, we compare predicted on and off states with test labels.", "start": 9.37119, "end": 14.82824}, {"text": "We count true positives, true negatives, false positives, and false negatives, then calculate one MCC for that device.", "start": 16.46139, "end": 25.39857}, {"text": "To calculate macro MCC, we add the 9 MCC scores and divide by 9.", "start": 26.83096, "end": 33.48966}, {"text": "Each device receives equal weight, regardless of its duration or power rating.", "start": 34.64224, "end": 39.93967}, {"text": "We average device scores rather than combine all devices into one confusion matrix.", "start": 41.45305, "end": 47.2096}, {"text": "This test metric is separate from the aggregate-only selection score.", "start": 48.02078, "end": 52.09066}, {"text": "We use test labels only after selection is locked.", "start": 52.77231, "end": 55.77961}, {"text": "Event F-one is secondary.", "start": 56.7942, "end": 58.52866}], "slide_image": "automation2026/slides/slide-6.png"}, {"number": 7, "title": "Frozen seed-101 test comparison", "audio": "automation2026/slide-07-frozen-seed-101-test-comparison.mp3?v=7e3cf289ea7ea762", "transcript": "In the frozen seed 101 test comparison, LHS rose from 0.0991 without bounds to 0.6244 with bounds. The LLM arm rose from 0.4850 to 0.5577. Those are differences between complete bounded and unbounded procedures, not isolated effects of the candidate limits. The strongest pooled result was actually a simple threshold-only baseline, at 0.8059 MCC. This is important to state plainly: our more elaborate candidate generators did not win the overall test comparison. The observed gain in the bounded arms supports examining the role of engineering limits, while the baseline keeps the performance claim in perspective.", "sentence_cues": [{"text": "In the frozen seed 101 test comparison, LHS rose from 0.0991 without bounds to 0.6244 with bounds.", "start": 0.68349, "end": 12.92804}, {"text": "The LLM arm rose from 0.4850 to 0.5577.", "start": 14.54098, "end": 20.61951}, {"text": "Those are differences between complete bounded and unbounded procedures, not isolated effects of the candidate limits.", "start": 21.61123, "end": 28.76949}, {"text": "The strongest pooled result was actually a simple threshold-only baseline, at 0.8059 MCC.", "start": 29.90131, "end": 37.83919}, {"text": "This is important to state plainly: our more elaborate candidate generators did not win the overall test comparison.", "start": 38.89073, "end": 47.52935}, {"text": "The observed gain in the bounded arms supports examining the role of engineering limits, while the baseline keeps the performance claim in perspective.", "start": 48.54111, "end": 58.9296}], "slide_image": "automation2026/slides/slide-7.png"}, {"number": 8, "title": "Five LLM test seeds", "audio": "automation2026/slide-08-five-llm-test-seeds.mp3?v=721267dbb5d498bf", "transcript": "Across 5 LLM test seeds, mean MCC was 0.6262 without bounds, with a sample standard deviation of 0.1131. With bounds, the mean was 0.5951, with a smaller standard deviation of 0.0413. So bounds reduced variation, but the mean was also lower. The table below shows the evidence available: 5 LLM test seeds, 1 LHS test seed, and 20 LHS validation seeds. The 20 LHS seeds add no repeated test result. We therefore cannot treat this as a matched repeated-test comparison between LLM and LHS.", "sentence_cues": [{"text": "Across 5 LLM test seeds, mean MCC was 0.6262 without bounds, with a sample standard deviation of 0.1131.", "start": 0.38101, "end": 12.58934}, {"text": "With bounds, the mean was 0.5951, with a smaller standard deviation of 0.0413.", "start": 13.50091, "end": 21.71959}, {"text": "So bounds reduced variation, but the mean was also lower.", "start": 22.67079, "end": 26.33768}, {"text": "The table below shows the evidence available: 5 LLM test seeds, 1 LHS test seed, and 20 LHS validation seeds.", "start": 27.15923, "end": 38.7506}, {"text": "The 20 LHS seeds add no repeated test result.", "start": 39.55214, "end": 43.43961}, {"text": "We therefore cannot treat this as a matched repeated-test comparison between LLM and LHS.", "start": 44.47123, "end": 51.50918}], "slide_image": "automation2026/slides/slide-8.png"}, {"number": 9, "title": "Full compliance is rare without bounds", "audio": "automation2026/slide-09-full-compliance-is-rare-without-bounds.mp3?v=24011e30ea401c23", "transcript": "Here, we use only validation data for an extra check. We check how many candidates meet all the engineering limits. Only 5 out of 225 LLM configurations did so, or 2.22%. For LHS, 54 out of 900 did so, or 6%. The LLM proposals were closer to the ranges on average, but fewer met all the limits at once. Also, none of the selected unbounded configurations from either source were fully compliant. Being close to a range does not mean meeting every limit. These numbers show whether candidates meet the engineering limits. This check adds no new test results.", "sentence_cues": [{"text": "Here, we use only validation data for an extra check.", "start": 0.50122, "end": 3.94959}, {"text": "We check how many candidates meet all the engineering limits.", "start": 4.85178, "end": 8.13976}, {"text": "Only 5 out of 225 LLM configurations did so, or 2.22%.", "start": 9.01109, "end": 16.18959}, {"text": "For LHS, 54 out of 900 did so, or 6%.", "start": 17.08134, "end": 22.19936}, {"text": "The LLM proposals were closer to the ranges on average, but fewer met all the limits at once.", "start": 23.09092, "end": 30.22913}, {"text": "Also, none of the selected unbounded configurations from either source were fully compliant.", "start": 31.76226, "end": 38.13941}, {"text": "Being close to a range does not mean meeting every limit.", "start": 39.09098, "end": 42.21904}, {"text": "These numbers show whether candidates meet the engineering limits.", "start": 42.92085, "end": 46.38979}, {"text": "This check adds no new test results.", "start": 47.40339, "end": 50.09906}], "slide_image": "automation2026/slides/slide-9.png"}, {"number": 10, "title": "Post-hoc validation decomposition", "audio": "automation2026/slide-10-post-hoc-validation-decomposition.mp3?v=aecc048dd5460525", "transcript": "This page uses unbounded validation pools only. Every delta means LLM minus LHS. A pool ceiling is the best validation MCC available inside that fixed pool. Selection regret is the gap between this ceiling and the score of the chosen candidate. Selected MCC therefore equals ceiling minus regret. In the first row, with equal device weights, the selected difference is 0.3150. A higher pool ceiling and lower selection regret both contribute. In the second row, with equal dataset weights, the selected difference is 0.2786. The ceiling difference is close to zero, so lower regret explains most of the difference. These are post-hoc diagnostics. The oracle uses validation labels to find the ceiling. We cannot use it as a label-free selector.", "sentence_cues": [{"text": "This page uses unbounded validation pools only.", "start": 0.28056, "end": 3.82766}, {"text": "Every delta means LLM minus LHS.", "start": 4.78958, "end": 9.51904}, {"text": "A pool ceiling is the best validation MCC available inside that fixed pool.", "start": 10.99217, "end": 16.2098}, {"text": "Selection regret is the gap between this ceiling and the score of the chosen candidate.", "start": 17.1017, "end": 22.09929}, {"text": "Selected MCC therefore equals ceiling minus regret.", "start": 22.67008, "end": 27.22908}, {"text": "In the first row, with equal device weights, the selected difference is 0.3150.", "start": 28.18112, "end": 34.53982}, {"text": "A higher pool ceiling and lower selection regret both contribute.", "start": 35.61272, "end": 39.68942}, {"text": "In the second row, with equal dataset weights, the selected difference is 0.2786.", "start": 41.26229, "end": 48.89847}, {"text": "The ceiling difference is close to zero, so lower regret explains most of the difference.", "start": 50.31068, "end": 56.06218}, {"text": "These are post-hoc diagnostics.", "start": 57.36479, "end": 59.30868}, {"text": "The oracle uses validation labels to find the ceiling.", "start": 60.96109, "end": 64.24668}, {"text": "We cannot use it as a label-free selector.", "start": 65.26842, "end": 68.07319}], "slide_image": "automation2026/slides/slide-10.png"}, {"number": 11, "title": "What the evidence supports", "audio": "automation2026/slide-11-what-the-evidence-supports.mp3?v=f31c3c8b57f331a3", "transcript": "The three rows summarize three evidence sets. In validation, unbounded LLM pools had higher selected MCC, but we found no bounded LLM advantage. In the frozen seed 101 test, the threshold-only baseline remained strongest. Across 5 LLM test seeds, bounds reduced variation but also lowered mean MCC. Together, these findings show why we need to check candidate feasibility, selection quality, and a simple baseline. Bounds change both generation and reconstruction. The generators receive different information, and repeated-test evidence is unequal. We cannot isolate the effect of bounds alone or claim that the method will generalize to another facility.", "sentence_cues": [{"text": "The three rows summarize three evidence sets.", "start": 0.38217, "end": 3.31886}, {"text": "In validation, unbounded LLM pools had higher selected MCC, but we found no bounded LLM advantage.", "start": 4.45115, "end": 13.16845}, {"text": "In the frozen seed 101 test, the threshold-only baseline remained strongest.", "start": 14.86176, "end": 20.59969}, {"text": "Across 5 LLM test seeds, bounds reduced variation but also lowered mean MCC.", "start": 21.47106, "end": 28.74944}, {"text": "Together, these findings show why we need to check candidate feasibility, selection quality, and a simple baseline.", "start": 30.06137, "end": 39.35859}, {"text": "Bounds change both generation and reconstruction.", "start": 40.93095, "end": 43.89708}, {"text": "The generators receive different information, and repeated-test evidence is unequal.", "start": 44.47828, "end": 49.58884}, {"text": "We cannot isolate the effect of bounds alone or claim that the method will generalize to another facility.", "start": 51.04131, "end": 58.61971}], "slide_image": "automation2026/slides/slide-11.png"}, {"number": 12, "title": "Future work", "audio": "automation2026/slide-12-future-work.mp3?v=bd841ee6e1036074", "transcript": "The next step is independent controlled validation. We would specify device states, physical behavior, and a feasible region independently of the generators. Then we would test correct, boundary-adjacent, and misspecified bounds while separating candidate restrictions from reconstruction caps. That would show when bounds help, when generation adds value, and when the procedure fails. For now, assess bounds, the selector, and a simple baseline together.", "sentence_cues": [{"text": "The next step is independent controlled validation.", "start": 0.80428, "end": 3.69968}, {"text": "We would specify device states, physical behavior, and a feasible region independently of the generators.", "start": 4.63123, "end": 12.38953}, {"text": "Then we would test correct, boundary-adjacent, and misspecified bounds while separating candidate restrictions from reconstruction caps.", "start": 13.3008, "end": 21.73947}, {"text": "That would show when bounds help, when generation adds value, and when the procedure fails.", "start": 22.63088, "end": 28.84917}, {"text": "For now, assess bounds, the selector, and a simple baseline together.", "start": 29.86142, "end": 34.71955}], "slide_image": "automation2026/slides/slide-12.png"}, {"number": 13, "title": "Thank you and Q&A", "audio": "automation2026/slide-13-thank-you-and-q-a.mp3?v=8d285e866201ba32", "transcript": "Thank you for listening. I am happy to take your questions. If we do not have enough time, please email me at d11351004@mail.ntust.edu.tw.", "sentence_cues": [{"text": "Thank you for listening.", "start": 3.06816, "end": 4.01067}, {"text": "I am happy to take your questions.", "start": 5.35424, "end": 7.33952}, {"text": "If we do not have enough time, please email me at d11351004@mail.ntust.edu.tw.", "start": 8.23063, "end": 18.88926}], "slide_image": "automation2026/slides/slide-13.png"}, {"number": 14, "title": "Q&A: How were the numbers calculated?", "audio": "automation2026/slide-14-q-a-how-were-the-numbers-calculated.mp3?v=e4303c23bf2c4480", "transcript": "We compare predicted and true on/off states for each device. We count the 4 outcomes, calculate an MCC for each device, and average the 9 device scores. The configuration is locked before test labels are used. The 5-seed result averages 5 macro MCCs. The compliance figures are direct fractions. The validation decomposition is a post-hoc diagnostic, and its oracle ceiling is not a deployable selector.", "sentence_cues": [{"text": "We compare predicted and true on/off states for each device.", "start": 0.52229, "end": 4.3993}, {"text": "We count the 4 outcomes, calculate an MCC for each device, and average the 9 device scores.", "start": 5.29091, "end": 12.8489}, {"text": "The configuration is locked before test labels are used.", "start": 14.08093, "end": 17.44838}, {"text": "The 5-seed result averages 5 macro MCCs.", "start": 18.00962, "end": 22.39933}, {"text": "The compliance figures are direct fractions.", "start": 23.41201, "end": 26.3081}, {"text": "The validation decomposition is a post-hoc diagnostic, and its oracle ceiling is not a deployable selector.", "start": 27.56138, "end": 34.91941}], "slide_image": "automation2026/slides/slide-14.png"}, {"number": 15, "title": "Q&A response pack", "audio": "automation2026/slide-15-q-a-response-pack.mp3?v=eaaa13c6435ccc43", "transcript": "Q1. How did you calculate the MCC values and the main conclusion? Answer. On the sealed test data, we calculate MCC from each device's on/off confusion matrix, then average the nine device MCCs equally. The threshold-only baseline scores 0.8059; bounded LHS scores 0.6244 in the frozen seed 101 comparison. So our conclusion concerns the role of bounds in this comparison, not an overall win for the generator.\n\nQ2. How did you get 2.22 percent, 6 percent, or the 0.3150 advantage? Answer. The compliance percentages are counts of complete configurations: 5/225 for LLM, and 54/900 for LHS. The 0.3150 is different: unbounded LLM-minus-LHS selected MCC on validation data, weighted equally by device. With equal dataset weighting, it becomes 0.2786. That post-hoc analysis adds no new test result.\n\nQ3. Why do the bounded results seem contradictory? Answer. They answer different questions. In the single frozen seed 101 test, both bounded arms scored higher. Across 5 LLM test seeds, bounds lowered mean MCC from 0.6262 to 0.5951, while reducing variation. The validation pool audit is a third, post-hoc analysis. I would therefore not say “bounds always help”; the result depends on which comparison we report.\n\nQ4. What exactly is the future experiment? Answer. We would use an independent controlled system with device states, physical behavior, and a feasible region specified before candidate generation. We would test correct, boundary-adjacent, and misspecified bounds, while varying candidate restrictions and reconstruction caps separately. That would distinguish the mechanisms and show where the approach fails. This validation is future work, not a completed experiment in this paper.\n\nGeneral response. Answer. Thank you. This study does not directly test that case, so I do not want to infer a result from the current numbers. We can report the fixed-budget comparison on these 3 datasets under a common aggregate-only selector. Answering the broader question would require an independent controlled comparison or a held-out facility designed for that condition.", "sentence_cues": [{"text": "Q1.", "start": 0.94144, "end": 1.62249}, {"text": "How did you calculate the MCC values and the main conclusion?", "start": 2.92449, "end": 6.79041}, {"text": "Answer.", "start": 7.65174, "end": 7.97223}, {"text": "On the sealed test data, we calculate MCC from each device's on/off confusion matrix, then average the nine device MCCs equally.", "start": 9.31429, "end": 22.9889}, {"text": "The threshold-only baseline scores 0.8059; bounded LHS scores 0.6244 in the frozen seed 101 comparison.", "start": 24.20145, "end": 35.98895}, {"text": "So our conclusion concerns the role of bounds in this comparison, not an overall win for the generator.", "start": 37.22091, "end": 43.73384}, {"text": "Q2.", "start": 45.21678, "end": 45.77789}, {"text": "How did you get 2.22 percent, 6 percent, or the 0.3150 advantage?", "start": 47.65063, "end": 55.12083}, {"text": "Answer.", "start": 55.88187, "end": 56.18228}, {"text": "The compliance percentages are counts of complete configurations: 5/225 for LLM, and 54/900 for LHS.", "start": 57.28379, "end": 70.07955}, {"text": "The 0.3150 is different: unbounded LLM-minus-LHS selected MCC on validation data, weighted equally by device.", "start": 71.05082, "end": 83.7646}, {"text": "With equal dataset weighting, it becomes 0.2786.", "start": 85.5086, "end": 90.25949}, {"text": "That post-hoc analysis adds no new test result.", "start": 91.31095, "end": 94.75773}, {"text": "Q3.", "start": 95.59939, "end": 96.32081}, {"text": "Why do the bounded results seem contradictory?", "start": 96.92199, "end": 99.5672}, {"text": "Answer.", "start": 100.28862, "end": 100.54913}, {"text": "They answer different questions.", "start": 101.76103, "end": 103.14442}, {"text": "In the single frozen seed 101 test, both bounded arms scored higher.", "start": 104.28722, "end": 109.37971}, {"text": "Across 5 LLM test seeds, bounds lowered mean MCC from 0.6262 to 0.5951, while reducing variation.", "start": 110.49124, "end": 122.34456}, {"text": "The validation pool audit is a third, post-hoc analysis.", "start": 123.62777, "end": 128.17915}, {"text": "I would therefore not say “bounds always help”; the result depends on which comparison we report.", "start": 129.33097, "end": 135.70436}, {"text": "Q4.", "start": 137.36785, "end": 138.04928}, {"text": "What exactly is the future experiment?", "start": 139.08066, "end": 141.48532}, {"text": "Answer.", "start": 142.2468, "end": 142.5073}, {"text": "We would use an independent controlled system with device states, physical behavior, and a feasible region specified before candidate generation.", "start": 143.40905, "end": 152.90944}, {"text": "We would test correct, boundary-adjacent, and misspecified bounds, while varying candidate restrictions and reconstruction caps separately.", "start": 153.82082, "end": 164.11908}, {"text": "That would distinguish the mechanisms and show where the approach fails.", "start": 165.43209, "end": 169.02905}, {"text": "This validation is future work, not a completed experiment in this paper.", "start": 170.06115, "end": 174.51174}, {"text": "General response.", "start": 175.11317, "end": 176.13561}, {"text": "Answer.", "start": 176.77714, "end": 177.0578}, {"text": "Thank you.", "start": 177.45876, "end": 177.83967}, {"text": "This study does not directly test that case, so I do not want to infer a result from the current numbers.", "start": 178.39017, "end": 185.10948}, {"text": "We can report the fixed-budget comparison on these 3 datasets under a common aggregate-only selector.", "start": 186.40194, "end": 193.21934}, {"text": "Answering the broader question would require an independent controlled comparison or a held-out facility designed for that condition.", "start": 194.45148, "end": 202.06962}], "slide_image": "automation2026/slides/slide-14.png"}, {"number": 16, "title": "Pronunciation: NILM and key terms", "audio": "automation2026/pronunciation-guide.mp3", "transcript": "NILM — N–I–L–M\n\nMatthews correlation coefficient\n\narithmetic mean\n\nmisspecified bounds\n\nMCC — M–C–C", "highlight": false}]}, {"id": "conference", "title": "研討會講稿", "items": [{"number": 1, "title": "Title and research question", "audio": "slide-01-title-and-research-question.mp3", "transcript": "Good morning. I am Chung-Kuang Chen from National Taiwan University of Science and Technology. This presentation asks one practical question: when should an industrial pseudo-NILM system produce an attribution result, and when should it stop? We present a frozen defensive dispatch. It selects a corpus-specific route and returns an explicit no-score output when the required pseudo-trace support is absent.", "slide_image": "slides/slide-1.png"}, {"number": 2, "title": "Unequal evidence across industrial sites", "audio": "slide-02-unequal-evidence-across-industrial-sites.mp3", "transcript": "Industrial sites do not provide one uniform evidence condition. Variable-frequency loads do not behave like simple on-off appliances. Similar machines can have duplicated roles but different aggregate signatures. Production schedules create process dependencies. Unmonitored loads can also dominate the aggregate measurement. Therefore, the same aggregate signal may support one attribution method at one site but not at another. Our design starts by recognizing this evidence mismatch before producing a device-level result.", "slide_image": "slides/slide-2.png"}, {"number": 3, "title": "Positioning among industrial NILM approaches", "audio": "slide-03-positioning-among-industrial-nilm-approaches.mp3", "transcript": "Recent industrial NILM studies address different parts of this problem. Li and colleagues use equipment and process constraints in a mixed-integer model. Fabri and colleagues reduce labeling demand through active learning, although a supervised stage remains. Yan and colleagues show that differences in datasets, metrics, and implementations still make NILM results difficult to compare. Our study targets a different operating condition. We freeze a route-selection protocol, apply bounded transformations, and allow an explicit no-score result. We do not claim state-of-the-art superiority over these methods.", "slide_image": "slides/slide-3.png"}, {"number": 4, "title": "Frozen defensive dispatch", "audio": "slide-04-frozen-defensive-dispatch.mp3", "transcript": "The system receives aggregate power, declared device priors, and deterministic pseudo traces. These pseudo traces contain timing evidence but no target labels. A frozen dispatch rule selects one of four outcomes. IMDELD uses modulated allocation with pair calibration. WELTRON uses guarded repair. Case1 uses event rectangles. HIPE receives no score because its evaluated configuration does not provide the required pseudo-trace support. Equipment labels enter only after reconstruction, when we calculate TECA and descriptive diagnostics. The design principle is simple: do not force every corpus through the same reconstruction path.", "slide_image": "slides/slide-4.png"}, {"number": 5, "title": "Corpus-specific routes", "audio": "slide-05-corpus-specific-routes.mp3", "transcript": "The four corpora serve different roles. IMDELD is an open industrial-machine dataset with six scored devices. WELTRON is a private field dataset with two scored targets. Case1 is a single-compressor case in IEEE DataPort. These three receive attribution scores. HIPE is public and useful, but it is used only to examine the no-score boundary. It is not a fourth scored result. This distinction matters because all four corpora informed the pilot protocol.", "slide_image": "slides/slide-5.png"}, {"number": 6, "title": "Evaluation contract", "audio": "slide-06-evaluation-contract.mp3", "transcript": "The evaluation has five stages. Development establishes the candidate routes. Validation labels select a small set of bounded constants. We then freeze the protocol. During the reported execution, the system reads only aggregate power, device priors, and pseudo traces. Equipment labels are used afterward for TECA and descriptive diagnostics. This separation prevents labels from entering dispatch or trace construction in the reported final execution. However, all four corpora informed the design, and earlier diagnostics affected component development. We therefore describe the evidence as a traceable pilot, not as a pristine confirmatory test.", "slide_image": "slides/slide-6.png"}, {"number": 7, "title": "Main TECA results", "audio": "slide-07-main-teca-results.mp3", "transcript": "All three scored datasets exceed the fixed full-partition TECA reference of 0.7. IMDELD reaches 0.7619. WELTRON reaches 0.8021. Case1 reaches 0.7136. The mean is 0.7592, and the weakest full-partition result is 0.7136. The lowest bootstrap lower bound is 0.7061 for the activity chunks used in this analysis. This interval is conditional on those chunks. It is not a confidence interval for the complete time partition. Segment F1 remains between 0.15 and 0.32. Therefore, the supported claim is energy-focused attribution, not precise temporal reconstruction.", "slide_image": "slides/slide-7.png"}, {"number": 8, "title": "Component evidence", "audio": "slide-08-component-evidence.mp3", "transcript": "The component analysis links each tested change to its target corpus. Removing pair calibration lowers IMDELD from 0.7619 to 0.7210. Removing guarded repair lowers WELTRON from 0.8021 to 0.7223. Removing the Case1-specific route lowers Case1 from 0.7136 to 0.5900. These changes support the route-specific components in the observed corpora. They do not show transfer to unseen facilities.", "slide_image": "slides/slide-8.png"}, {"number": 9, "title": "HIPE proxy inversion", "audio": "slide-09-hipe-proxy-inversion.mp3", "transcript": "The most important negative result appears in HIPE. The retrospective equipment-based audit gives HIPE a score of 0.1602, which is consistent with abstention. A nameplate-only proxy raises the score to 0.9220 and changes the decision to score. The reason is that monitored devices contribute only 3.83% of aggregate energy. Nameplate ratings describe device potential, but they do not measure realized contribution to the observed aggregate. This result shows that a simple nameplate proxy is unsafe for this boundary. A deployable identifiability proxy remains unresolved.", "slide_image": "slides/slide-9.png"}, {"number": 10, "title": "Supported claims and limits", "audio": "slide-10-supported-claims-and-limits.mp3", "transcript": "The evidence supports four conclusions. Three datasets exceed the fixed TECA reference. Each tested route component affects its associated corpus. The frozen protocol makes the no-score boundary visible. The evaluation settings remain traceable. Several claims remain outside the evidence. We do not establish generalization to unseen plants, precise segment reconstruction, fully label-free operation, or a validated safety controller. The practical contribution is a defensive reporting protocol in which explicit abstention is part of the system output. Thank you. I welcome your questions.", "slide_image": "slides/slide-10.png"}, {"number": 11, "title": "Thank you and Q&A", "audio": "slide-11-thank-you-and-q-a.mp3", "transcript": "Thank you for listening. I am happy to take your questions. If we do not have enough time, please email me at d11351004@mail.ntust.edu.tw.", "slide_image": "slides/slide-15.png"}, {"number": 12, "title": "Q&A response pack", "audio": "slide-12-q-a-response-pack.mp3", "transcript": "Question one. Is this method training-free?\n\nThe main method does not train a supervised model. However, we still use labeled data during setup to choose a few fixed values. So I do not call the whole system label-free.\n\nQuestion two. Why does HIPE receive no score?\n\nHIPE does not have the pseudo traces required by our fixed rule. The system is designed to stop in this case, so no-score is an expected result.\n\nQuestion three. Does this work at a new plant?\n\nWe do not know yet. All four datasets helped us build the method. We need a new test on a plant that was not used during development.\n\nQuestion four. Why use TECA instead of only F1?\n\nWe study how well the method assigns energy to devices, so TECA matches our main goal. The low F1 scores also show that we should not claim accurate event timing.\n\nQuestion five. Is 0.7 a general standard?\n\nNo. We use 0.7 only as a fixed reference in this study. It is not a general standard for industry.\n\nQuestion six. Can WELTRON be shared?\n\nPlease contact me. We can share a version after removing private information, if the request is reasonable. The public files do not include the original raw data.\n\nQuestion seven. What does the cost table measure?\n\nIt measures the CPU time and memory of the analysis after we fixed the method. It does not include making pseudo traces, searching for settings, or the full deployment cost.\n\nGeneral response one. Different setting or condition.\n\nThank you for the question. If I understand correctly, you are asking whether the method would work in another setting. We only tested it under the fixed setup used in this study. The results support device energy estimates on three datasets, and the system stops when the required data are missing. We still need more tests before using it in other conditions.\n\nGeneral response two. Question outside the tested evidence.\n\nThat is a good point. I do not want to say more than the results show. This study gives a careful rule for deciding when to report a result and when to stop. It is not a solution for every NILM problem. I will check your specific case and discuss it with you after the session. You can also email me.\n\nUseful phrase. Please repeat the question.\n\nSorry, could you please repeat or rephrase the question more slowly?", "slide_image": "slides/slide-15.png"}]}, {"id": "about-me", "title": "自我介紹", "items": [{"number": 1, "title": "我是誰 · Who I Am", "audio": "learning/about-v2/about-v2-01.mp3?v=40b9ec4f747d9743", "transcript": "Hello, my name is Chung-Kuang Chen. I am from Taiwan. I am from National Taiwan University of Science and Technology. My work is about AI and energy management.", "sentence_cues": [{"text": "Hello, my name is Chung-Kuang Chen.", "start": 0.0, "end": 2.10521}, {"text": "I am from Taiwan.", "start": 2.7067, "end": 3.60893}, {"text": "I am from National Taiwan University of Science and Technology.", "start": 4.21042, "end": 7.9998}, {"text": "My work is about AI and energy management.", "start": 8.77174, "end": 12.22938}]}, {"number": 2, "title": "我的工作 · What I Do", "audio": "learning/about-v2/about-v2-02.mp3?v=6a920e49a5da191c", "transcript": "I work with AI and power data. I use data from buildings and machines. I look for changes in how machines use energy. My goal is to help people save energy.", "sentence_cues": [{"text": "I work with AI and power data.", "start": 0.44088, "end": 2.58517}, {"text": "I use data from buildings and machines.", "start": 3.50701, "end": 5.59118}, {"text": "I look for changes in how machines use energy.", "start": 6.25251, "end": 9.33868}, {"text": "My goal is to help people save energy.", "start": 10.8537, "end": 12.90881}]}, {"number": 3, "title": "我的研究 · My Research", "audio": "learning/about-v2/about-v2-03.mp3?v=553acede47a8ea17", "transcript": "My research is about power data. I study how machines use electricity. I use AI to find patterns in the data. The goal is to understand how machines work.", "sentence_cues": [{"text": "My research is about power data.", "start": 0.34076, "end": 2.26506}, {"text": "I study how machines use electricity.", "start": 2.94658, "end": 5.25172}, {"text": "I use AI to find patterns in the data.", "start": 5.81298, "end": 8.67937}, {"text": "The goal is to understand how machines work.", "start": 9.8534, "end": 12.40937}]}, {"number": 4, "title": "為什麼做這件事 · Why This Matters", "audio": "learning/about-v2/about-v2-04.mp3?v=bbfac0705787fdb7", "transcript": "I study power data because I want to understand energy use. The data can show changes in a machine. These changes can help us find possible problems. I want to make this information easier to use.", "sentence_cues": [{"text": "I study power data because I want to understand energy use.", "start": 0.58112, "end": 4.40848}, {"text": "The data can show changes in a machine.", "start": 7.81503, "end": 9.95915}, {"text": "These changes can help us find possible problems.", "start": 11.09074, "end": 14.09728}, {"text": "I want to make this information easier to use.", "start": 16.70294, "end": 19.52908}]}, {"number": 5, "title": "最近做了什麼 · A Recent Task", "audio": "learning/about-v2/about-v2-05.mp3?v=6759c089fc49155f", "transcript": "I worked on an English talk for a conference. I checked the script and the slides. I asked for simpler words. I also asked for audio to practice with.", "sentence_cues": [{"text": "I worked on an English talk for a conference.", "start": 0.56139, "end": 3.18789}, {"text": "I checked the script and the slides.", "start": 3.66908, "end": 5.654}, {"text": "I asked for simpler words.", "start": 6.33568, "end": 7.9998}, {"text": "I also asked for audio to practice with.", "start": 8.91336, "end": 11.26972}]}, {"number": 6, "title": "接下來想做什麼 · My Next Step", "audio": "learning/about-v2/about-v2-06.mp3?v=2f184d44080d0987", "transcript": "I want to explain my work in simple English. I plan to practice with short audio lessons. I would like to answer questions in my own words. I want to use these sentences in real conversations.", "sentence_cues": [{"text": "I want to explain my work in simple English.", "start": 0.4008, "end": 2.94589}, {"text": "I plan to practice with short audio lessons.", "start": 3.54709, "end": 6.11222}, {"text": "I would like to answer questions in my own words.", "start": 7.01403, "end": 9.55912}, {"text": "I want to use these sentences in real conversations.", "start": 10.87267, "end": 14.06897}]}]}, {"id": "daily-practice", "title": "每日練習 · 100 集", "items": [{"number": 1, "title": "自我介紹 · Introducing Myself", "audio": "learning/pel100/pel100-001.mp3?v=465bc98110b36173", "transcript": "Hi, I'm Sam. I work with technology and business. I enjoy learning new things. I want to improve my English so I can talk to more people.", "sentence_cues": [{"text": "Hi, I'm Sam.", "start": 0.38071, "end": 1.52282}, {"text": "I work with technology and business.", "start": 2.26419, "end": 4.24787}, {"text": "I enjoy learning new things.", "start": 5.10946, "end": 6.49202}, {"text": "I want to improve my English so I can talk to more people.", "start": 7.13321, "end": 10.259}]}, {"number": 2, "title": "早晨習慣 · My Morning Routine", "audio": "learning/pel100/pel100-002.mp3?v=d04e32fe32b4562b", "transcript": "I usually wake up at seven. After breakfast, I check my messages. Then I make a plan for the day. This helps me stay organized.", "sentence_cues": [{"text": "I usually wake up at seven.", "start": 0.54102, "end": 2.10395}, {"text": "After breakfast, I check my messages.", "start": 2.7652, "end": 5.00942}, {"text": "Then I make a plan for the day.", "start": 5.61055, "end": 7.27367}, {"text": "This helps me stay organized.", "start": 8.1954, "end": 10.1591}]}, {"number": 3, "title": "我的家庭 · My Family", "audio": "learning/pel100/pel100-003.mp3?v=8b1aa6ebe417a9bb", "transcript": "I live with my family. We usually have dinner together. Everyone is busy during the day. That's why we enjoy talking at night.", "sentence_cues": [{"text": "I live with my family.", "start": 0.42083, "end": 1.72339}, {"text": "We usually have dinner together.", "start": 2.32458, "end": 3.96781}, {"text": "Everyone is busy during the day.", "start": 4.48884, "end": 6.25231}, {"text": "That's why we enjoy talking at night.", "start": 6.93365, "end": 9.15803}]}, {"number": 4, "title": "住家附近 · My Neighborhood", "audio": "learning/pel100/pel100-004.mp3?v=bea02f9e931486d2", "transcript": "There is a small park near my home. Many people go there in the evening. I sometimes walk there after dinner. It's a nice place to relax.", "sentence_cues": [{"text": "There is a small park near my home.", "start": 0.38071, "end": 2.28423}, {"text": "Many people go there in the evening.", "start": 3.14583, "end": 5.00928}, {"text": "I sometimes walk there after dinner.", "start": 6.11132, "end": 8.05492}, {"text": "It's a nice place to relax.", "start": 8.87644, "end": 10.29907}]}, {"number": 5, "title": "飲食習慣 · Eating Habits", "audio": "learning/pel100/pel100-005.mp3?v=78f14fb0670db9ce", "transcript": "I try to eat healthy food every day. I usually have vegetables and rice for lunch. Sometimes I eat too much when I'm busy. I'm trying to change that habit.", "sentence_cues": [{"text": "I try to eat healthy food every day.", "start": 0.52071, "end": 2.68367}, {"text": "I usually have vegetables and rice for lunch.", "start": 3.26446, "end": 5.98818}, {"text": "Sometimes I eat too much when I'm busy.", "start": 11.69598, "end": 14.03918}, {"text": "I'm trying to change that habit.", "start": 15.33306, "end": 17.08874}]}, {"number": 6, "title": "介紹自己的工作 · Describing My Job", "audio": "learning/pel100/pel100-006.mp3?v=786f9e2fe039042f", "transcript": "I work as a project manager. My job is to help different teams work together. I spend a lot of time solving problems. What I enjoy most is seeing a project succeed.", "sentence_cues": [{"text": "I work as a project manager.", " 'd prefer the fastest route.", "start": 7.65519, "end": 9.25837}, {"text": "Could you tell me which platform to use?", "start": 11.35626, "end": 13.24905}]}, {"number": 13, "title": "預訂餐廳 · Booking a Restaurant", "audio": "learning/pel100/pel100-013.mp3?v=5d7457245fa90288", "transcript": "I'd like to book a table for four people. Do you have anything available around seven tonight? We prefer a quiet area if possible. Could you confirm the reservation by text?", "sentence_cues": [{"text": "I'd like to book a table for four people.", "start": 0.52108, "end": 2.5653}, {"text": "Do you have anything available around seven tonight?", "start": 3.62749, "end": 6.07255}, {"text": "We prefer a quiet area if possible.", "start": 6.99445, "end": 9.27917}, {"text": "Could you confirm the reservation by text?", "start": 10.51356, "end": 12.60896}]}, {"number": 14, "title": "飯店入住 · Checking Into a Hotel", "audio": "learning/pel100/pel100-014.mp3?v=b52dc2659965106f", "transcript": "Hello, I have a reservation under the name Chen. I booked a room for two nights. Is breakfast included in the price? Also, what time do I need to check out?", "sentence_cues": [{"text": "Hello, I have a reservation under the name Chen.", "start": 0.30067, "end": 3.46767}, {"text": "I booked a room for two nights.", "start": 4.08905, "end": 5.69259}, {"text": "Is breakfast included in the price?", "start": 6.65472, "end": 8.77942}, {"text": "Also, what time do I need to check out?", "start": 9.81302, "end": 12.16986}]}, {"number": 15, "title": "慶祝生日 · Celebrating a Birthday", "audio": "learning/pel100/pel100-015.mp3?v=50b96e77ebdf0087", "transcript": "Today is my mother's birthday. We're having dinner at her favorite restaurant. I bought her a small gift yesterday. I hope she enjoys the surprise.", "sentence_cues": [{"text": "Today is my mother's birthday.", "start": 0.32073, "end": 1.88428}, {"text": "We're having dinner at her favorite restaurant.", "start": 3.06697, "end": 5.4123}, {"text": "I bought
