<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173a42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shadow">
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Personal English Loop</title>
  <style>
    :root {
      color-scheme: light;
      --ink: oklch(25% 0.035 215);
      --muted: oklch(48% 0.035 215);
      --paper: oklch(96% 0.018 78);
      --paper-deep: oklch(91% 0.025 78);
      --teal: oklch(37% 0.075 205);
      --orange: oklch(68% 0.15 48);
      --line: oklch(82% 0.035 78);
      --focus: oklch(55% 0.13 205);
      --display: "Avenir Next", Avenir, "Trebuchet MS", sans-serif;
      --reading: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--paper-deep); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(90deg, var(--teal) 0 0.72rem, transparent 0.72rem),
        repeating-linear-gradient(0deg, transparent 0 2.95rem, color-mix(in oklch, var(--line), transparent 65%) 2.95rem 3rem),
        var(--paper);
      font-family: var(--display);
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1.75rem, env(safe-area-inset-left));
    }

    button, select, audio { font: inherit; }
    button:focus-visible, select:focus-visible, audio:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .shell { width: min(76rem, 100%); margin: 0 auto; }
    header {
      display: grid;
      gap: 0.4rem;
      padding: clamp(1rem, 3vw, 2.5rem) 0 clamp(1.5rem, 4vw, 3rem);
      border-bottom: 2px solid var(--ink);
    }
    .eyebrow {
      color: var(--teal);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      max-width: 18ch;
      font-size: clamp(2rem, 7vw, 5.2rem);
      font-weight: 650;
      letter-spacing: -0.055em;
      line-height: 0.98;
    }
    .lede { margin: 0.7rem 0 0; color: var(--muted); font-size: 1rem; }
    :is(h1, h2, p, .page-button) { text-wrap: pretty; overflow-wrap: break-word; }
    .install-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin-top: 0.8rem; }
    .install-button {
      min-height: 2.75rem;
      padding: 0.62rem 1rem;
      border: 1px solid var(--teal);
      border-radius: 999px;
      color: var(--paper);
      background: var(--teal);
      font-weight: 700;
      cursor: pointer;
    }
    .install-button:active { transform: translateY(1px); }
    .install-status { margin: 0; max-width: 48ch; color: var(--muted); font-size: 0.88rem; line-height: 1.55; }

    .workspace { display: grid; gap: 2rem; padding-top: clamp(1.5rem, 4vw, 3rem); }
    nav { min-width: 0; }
    .select-label { display: grid; gap: 0.35rem; margin-bottom: 0.85rem; color: var(--muted); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; }
    .collection-select, .mobile-select { width: 100%; min-height: 3rem; padding: 0.65rem 0.8rem; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); }
    .page-list { display: none; list-style: none; margin: 0; padding: 0; }
    .page-button {
      width: 100%;
      display: grid;
      grid-template-columns: 2.2rem 1fr;
      gap: 0.6rem;
      min-height: 3.2rem;
      padding: 0.7rem 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      text-align: left;
      cursor: pointer;
    }
    .page-button[aria-current="true"] { color: var(--ink); font-weight: 650; }
    .page-button[aria-current="true"] .number { color: var(--orange); }
    .number { font-variant-numeric: tabular-nums; font-weight: 750; }

    main { min-width: 0; }
    .page-meta { display: flex; align-items: baseline; gap: 0.7rem; color: var(--teal); }
    .page-meta span { font-weight: 750; font-variant-numeric: tabular-nums; }
    h2 { margin: 0.4rem 0 1.5rem; font-size: clamp(1.55rem, 4vw, 2.8rem); line-height: 1.12; letter-spacing: -0.035em; }

    .player-desk {
      position: sticky;
      top: 0.75rem;
      z-index: 2;
      display: grid;
      gap: 0.8rem;
      padding: 1rem;
      color: var(--paper);
      background: var(--ink);
      border-radius: 0.2rem;
      box-shadow: 0 0.8rem 2.5rem color-mix(in oklch, var(--ink), transparent 78%);
    }
    audio { width: 100%; min-height: 3.2rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 0.55rem; align-items: center; }
    .controls button, .loop-label {
      min-height: 2.75rem;
      padding: 0.55rem 0.8rem;
      border: 1px solid color-mix(in oklch, var(--paper), transparent 56%);
      border-radius: 999px;
      color: inherit;
      background: transparent;
    }
    .controls button { cursor: pointer; }
    .controls button[aria-pressed="true"] { color: var(--ink); background: var(--orange); border-color: var(--orange); }
    .loop-label { display: inline-flex; align-items: center; gap: 0.45rem; margin-left: auto; }
    .status { grid-column: 1 / -1; margin: 0; color: color-mix(in oklch, var(--paper), transparent 25%); font-size: 0.82rem; line-height: 1.4; }

    .transcript {
      margin-top: clamp(2rem, 5vw, 4rem);
      max-width: 67ch;
      font-family: var(--reading);
      font-size: clamp(1.22rem, 2.2vw, 1.58rem);
      line-height: 1.78;
      letter-spacing: 0.006em;
    }
    .sentence { display: inline; transition: background-color 180ms ease-out; }
    .sentence:hover { background: color-mix(in oklch, var(--orange), transparent 70%); }
    .sentence::after { content: " "; }
    .practice-note { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.9rem; line-height: 1.6; }

    @media (min-width: 48rem) {
      body { padding-left: max(2.5rem, env(safe-area-inset-left)); }
      .workspace { grid-template-columns: minmax(13rem, 0.68fr) minmax(0, 2fr); align-items: start; gap: clamp(2rem, 6vw, 6rem); }
      nav { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow: auto; }
      .mobile-select { display: none; }
      .page-list { display: block; }
      .player-desk { grid-template-columns: minmax(16rem, 1fr) auto; align-items: center; }
      .controls { justify-content: flex-end; }
    }

    @media (hover: hover) {
      .page-button:hover { color: var(--ink); transform: translateX(0.18rem); }
      .controls button:hover { border-color: var(--orange); }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="eyebrow">Personal English Loop · practice desk</div>
      <h1>Listen. Read. Shadow.</h1>
      <p class="lede">選擇分類與教材，讓音檔與英文逐字稿保持在同一個畫面。</p>
      <div class="install-row">
        <button id="install-app" class="install-button" type="button" aria-describedby="install-status">安裝到手機</button>
        <p id="install-status" class="install-status" aria-live="polite">安裝後可從手機桌面直接開啟。</p>
      </div>
    </header>

    <div class="workspace">
      <nav aria-label="教材清單">
        <label class="select-label">練習分類
          <select id="collection-select" class="collection-select" aria-label="選擇練習分類"></select>
        </label>
        <select id="page-select" class="mobile-select" aria-label="選擇教材"></select>
        <ol id="page-list" class="page-list"></ol>
      </nav>

      <main id="main-content">
        <div class="page-meta"><span id="page-number">01</span><small id="collection-title">教材</small></div>
        <h2 id="page-title"></h2>

        <section class="player-desk" aria-label="Shadowing 播放控制">
          <audio id="practice-audio" controls preload="metadata"></audio>
          <div class="controls">
            <button id="rewind" type="button" title="倒退五秒">↶ 5 秒</button>
            <button class="speed" type="button" data-speed="0.8">0.8×</button>
            <button class="speed" type="button" data-speed="0.9">0.9×</button>
            <button class="speed" type="button" data-speed="1" aria-pressed="true">1×</button>
            <button id="repeat-all" type="button" aria-pressed="false">Repeat All</button>
            <label class="loop-label"><input id="loop" type="checkbox"> 重複本頁</label>
          </div>
          <p id="player-status" class="status" aria-live="polite"></p>
        </section>

        <article id="transcript" class="transcript" aria-live="polite"></article>
        <p class="practice-note">快捷鍵：空白鍵播放／暫停，← → 倒退或前進五秒。點選左側可切換下一頁。</p>
      </main>
    </div>
  </div>

  <script>
    const collections = [{"id": "conference", "title": "研討會講稿", "items": [{"number": 1, "title": "Title and research question", "audio": "slide-01-title-and-research-question.mp3", "transcript": "Good morning. I am Chung-Kuang Chen from National Taiwan University of Science and Technology. This presentation asks one practical question: when should an industrial pseudo nil-em system produce an attribution result, and when should it stop? We present a frozen defensive dispatch. It selects a corpus-specific route and returns an explicit no-score output when the required pseudo-trace support is absent."}, {"number": 2, "title": "Unequal evidence across industrial sites", "audio": "slide-02-unequal-evidence-across-industrial-sites.mp3", "transcript": "Industrial sites do not provide one uniform evidence condition. Variable-frequency loads do not behave like simple on-off appliances. Similar machines can have duplicated roles but different aggregate signatures. Production schedules create process dependencies. Unmonitored loads can also dominate the aggregate measurement. Therefore, the same aggregate signal may support one attribution method at one site but not at another. Our design starts by recognizing this evidence mismatch before producing a device-level result."}, {"number": 3, "title": "Positioning among industrial NILM approaches", "audio": "slide-03-positioning-among-industrial-nilm-approaches.mp3", "transcript": "Recent industrial NILM studies address different parts of this problem. Li and colleagues use equipment and process constraints in a mixed-integer model. Fabri and colleagues reduce labeling demand through active learning, although a supervised stage remains. Yan and colleagues show that differences in datasets, metrics, and implementations still make NILM results difficult to compare. Our study targets a different operating condition. We freeze a route-selection protocol, apply bounded transformations, and allow an explicit no-score result. We do not claim state-of-the-art superiority over these methods."}, {"number": 4, "title": "Frozen defensive dispatch", "audio": "slide-04-frozen-defensive-dispatch.mp3", "transcript": "The system receives aggregate power, declared device priors, and deterministic pseudo traces. These pseudo traces contain timing evidence but no target labels. A frozen dispatch rule selects one of four outcomes. eye em dee ee el dee uses modulated allocation with pair calibration. well-tron uses guarded repair. Case one uses event rectangles. hype receives no score because its evaluated configuration does not provide the required pseudo-trace support. Equipment labels enter only after reconstruction, when we calculate tee ee see ay and descriptive diagnostics. The design principle is simple: do not force every corpus through the same reconstruction path."}, {"number": 5, "title": "Corpus-specific routes", "audio": "slide-05-corpus-specific-routes.mp3", "transcript": "The four corpora serve different roles. eye em dee ee el dee is an open industrial-machine dataset with six scored devices. well-tron is a private field dataset with two scored targets. Case one is a single-compressor case in IEEE DataPort. These three receive attribution scores. hype is public and useful, but it is used only to examine the no-score boundary. It is not a fourth scored result. This distinction matters because all four corpora informed the pilot protocol."}, {"number": 6, "title": "Evaluation contract", "audio": "slide-06-evaluation-contract.mp3", "transcript": "The evaluation has five stages. Development establishes the candidate routes. Validation labels select a small set of bounded constants. We then freeze the protocol. During the reported execution, the system reads only aggregate power, device priors, and pseudo traces. Equipment labels are used afterward for tee ee see ay and descriptive diagnostics. This separation prevents labels from entering dispatch or trace construction in the reported final execution. However, all four corpora informed the design, and earlier diagnostics affected component development. We therefore describe the evidence as a traceable pilot, not as a pristine confirmatory test."}, {"number": 7, "title": "Main TECA results", "audio": "slide-07-main-teca-results.mp3", "transcript": "All three scored datasets exceed the fixed full-partition tee ee see ay reference of zero point seven. eye em dee ee el dee reaches zero point seven six one nine. well-tron reaches zero point eight zero two one. Case one reaches zero point seven one three six. The mean is zero point seven five nine two, and the weakest full-partition result is zero point seven one three six. A descriptive bootstrap over eligible activity-bearing chunks gives a worst lower endpoint of zero point seven zero six one. This interval is conditional on those chunks. It is not a confidence interval for the complete time partition. Segment F one remains between zero point one five and zero point three two. Therefore, the supported claim is energy-focused attribution, not precise temporal reconstruction."}, {"number": 8, "title": "Component evidence", "audio": "slide-08-component-evidence.mp3", "transcript": "The component analysis links each tested change to its target corpus. Removing pair calibration lowers eye em dee ee el dee from zero point seven six one nine to zero point seven two one zero. Removing guarded repair lowers well-tron from zero point eight zero two one to zero point seven two two three. Removing the Case one-specific route lowers Case one from zero point seven one three six to zero point five nine zero zero. These changes support the route-specific components in the observed corpora. They do not show transfer to unseen facilities."}, {"number": 9, "title": "HIPE proxy inversion", "audio": "slide-09-hipe-proxy-inversion.mp3", "transcript": "The most important negative result appears in hype. The retrospective equipment-based audit gives hype a score of zero point one six zero two, which is consistent with abstention. A nameplate-only proxy raises the score to zero point nine two two zero and changes the decision to score. The reason is that monitored devices contribute only three point eight three percent of aggregate energy. Nameplate ratings describe device potential, but they do not measure realized contribution to the observed aggregate. This result shows that a simple nameplate proxy is unsafe for this boundary. A deployable identifiability proxy remains unresolved."}, {"number": 10, "title": "Supported claims and limits", "audio": "slide-10-supported-claims-and-limits.mp3", "transcript": "The evidence supports four conclusions. Three datasets exceed the fixed tee ee see ay reference. Each tested route component affects its associated corpus. The frozen protocol makes the no-score boundary visible. The evaluation settings remain traceable. Several claims remain outside the evidence. We do not establish generalization to unseen plants, precise segment reconstruction, fully label-free operation, or a validated safety controller. The practical contribution is a defensive reporting protocol in which explicit abstention is part of the system output. Thank you. I welcome your questions."}]}, {"id": "about-me", "title": "自我介紹", "items": [{"number": 1, "title": "10-second introduction", "audio": "learning/about-me-01-10-seconds.mp3", "transcript": "Hello. I am Chung-Kuang Chen from Taiwan. My work is about AI and energy management."}, {"number": 2, "title": "30-second introduction", "audio": "learning/about-me-02-30-seconds.mp3", "transcript": "Hello. I am Chung-Kuang Chen from Taiwan. My work is about AI, IoT, and energy management. I study power data from buildings and machines. I use the data to understand equipment behavior, find unusual changes, and help people save energy. I enjoy turning technical ideas into simple and useful tools."}, {"number": 3, "title": "60-second introduction", "audio": "learning/about-me-03-60-seconds.mp3", "transcript": "Hello. I am Chung-Kuang Chen from Taiwan. I am from National Taiwan University of Science and Technology. My work brings together AI, IoT, and energy management. I study power signals from buildings and industrial machines. These signals help us understand how equipment works and when something changes. I use data to look for energy waste, unusual behavior, and possible problems. My goal is to make energy information easier to understand and use. In my research, I try to use clear methods and report limits honestly. I believe technology should support people, not replace their judgment. I also enjoy discussing research and learning from people in different fields. I am happy to share my work and hear about your ideas."}, {"number": 4, "title": "Listen and repeat", "audio": "learning/about-me-04-listen-repeat.mp3", "transcript": "Introducing myself. Listen and repeat. After each sentence, say it aloud.\n\nHello. I am Chung-Kuang Chen from Taiwan.\n\nYour turn.\n\nMy work is about AI, IoT, and energy management.\n\nYour turn.\n\nI study power data from buildings and machines.\n\nYour turn.\n\nI use the data to understand equipment behavior.\n\nYour turn.\n\nI look for unusual changes and possible problems.\n\nYour turn.\n\nMy goal is to help people understand and use energy information.\n\nYour turn.\n\nI enjoy turning technical ideas into simple and useful tools.\n\nYour turn.\n\nNow introduce yourself in your own words.\n\nYour turn."}, {"number": 5, "title": "Question and answer", "audio": "learning/about-me-05-qa.mp3", "transcript": "Introducing myself. Question and answer practice. Answer before you hear the model answer.\n\nQuestion one. What is your name?\n\nThink and answer.\n\nModel answer. I am Chung-Kuang Chen.\n\nQuestion two. Where are you from?\n\nThink and answer.\n\nModel answer. I am from Taiwan.\n\nQuestion three. What is your work about?\n\nThink and answer.\n\nModel answer. My work is about AI, IoT, and energy management.\n\nQuestion four. What kind of data do you study?\n\nThink and answer.\n\nModel answer. I study power data from buildings and machines.\n\nQuestion five. Why do you study this data?\n\nThink and answer.\n\nModel answer. I use the data to understand equipment behavior and find unusual changes.\n\nQuestion six. What is your goal?\n\nThink and answer.\n\nModel answer. My goal is to make energy information easier to understand and use.\n\nFinal challenge. Introduce yourself in about thirty seconds.\n\nTake your time and answer now."}]}, {"id": "daily-practice", "title": "每日練習", "items": [{"number": 1, "title": "Day 1 · Slow", "audio": "learning/daily-day-01-slow.mp3", "transcript": "Day one. What is energy management?\n\nListen slowly.\n\nHello. My work is about energy management.\n\nEnergy management means using energy in a smart way.\n\nWe first measure how much energy a building or a machine uses.\n\nThen we look at the data.\n\nWe try to find waste, unusual changes, and ways to save energy.\n\nFor example, a machine may use too much power at night.\n\nThe system can show this change.\n\nA manager can check the machine and take action.\n\nThe goal is simple.\n\nWe want to use less energy, lower cost, and keep the equipment working well.\n\nListen one more time.\n\nMy work is about energy management.\n\nWe measure energy use and look at the data.\n\nWe try to find waste and unusual changes.\n\nWe help people save energy and lower cost."}, {"number": 2, "title": "Day 1 · Natural", "audio": "learning/daily-day-01-natural.mp3", "transcript": "Day one. What is energy management?\n\nHello. My work is about energy management. Energy management means using energy in a smart way. We first measure how much energy a building or a machine uses. Then we look at the data. We try to find waste, unusual changes, and ways to save energy.\n\nFor example, a machine may use too much power at night. The system can show this change. A manager can check the machine and take action.\n\nThe goal is simple. We want to use less energy, lower cost, and keep the equipment working well.\n\nNow listen to a short conversation.\n\nWhat do you work on?\n\nI work on energy management.\n\nWhat does that mean?\n\nWe measure energy use and look at the data.\n\nWhy do you do that?\n\nWe want to find waste and help people save energy.\n\nCan you give me an example?\n\nYes. If a machine uses too much power, the system can show it.\n\nWhat happens next?\n\nA manager can check the machine and take action."}, {"number": 3, "title": "Day 1 · Listen and repeat", "audio": "learning/daily-day-01-listen-repeat.mp3", "transcript": "Day one. Listen and repeat. After each sentence, say it aloud.\n\nMy work is about energy management.\n\nYour turn.\n\nEnergy management means using energy in a smart way.\n\nYour turn.\n\nWe measure how much energy a building uses.\n\nYour turn.\n\nWe measure how much energy a machine uses.\n\nYour turn.\n\nThen we look at the data.\n\nYour turn.\n\nWe try to find waste.\n\nYour turn.\n\nWe look for unusual changes.\n\nYour turn.\n\nA machine may use too much power at night.\n\nYour turn.\n\nThe system can show this change.\n\nYour turn.\n\nA manager can check the machine.\n\nYour turn.\n\nA manager can take action.\n\nYour turn.\n\nWe want to save energy and lower cost.\n\nYour turn.\n\nWe want to keep the equipment working well.\n\nYour turn.\n\nNow say the short answer.\n\nI work on energy management. We use data to find waste and help people save energy.\n\nYour turn."}, {"number": 4, "title": "Day 1 · Question and answer", "audio": "learning/daily-day-01-qa.mp3", "transcript": "Day one. Question and answer practice. After each question, answer before you hear the model answer.\n\nQuestion one. What do you work on?\n\nThink and answer.\n\nModel answer. I work on energy management.\n\nQuestion two. What does energy management mean?\n\nThink and answer.\n\nModel answer. It means using energy in a smart way.\n\nQuestion three. What do you measure?\n\nThink a     const audio = document.querySelector('#practice-audio');
    const title = document.querySelector('#page-title');
    const number = document.querySelector('#page-number');
    const collectionTitle = document.querySelector('#collection-title');
    const transcript = document.querySelector('#transcript');
    const list = document.querySelector('#page-list');
    const select = document.querySelector('#page-select');
    const collectionSelect = document.querySelector('#collection-select');
    const speedButtons = [...document.querySelectorAll('.speed')];
    const repeatAll = document.querySelector('#repeat-all');
    const repeatPage = document.querySelector('#loop');
    const playerStatus = document.querySelector('#player-status');
    const installButton = document.querySelector('#install-app');
    const installStatus = document.querySelector('#install-status');
    const requestedCollection = decodeURIComponent(window.location.hash.slice(1));
    const requestedCollectionIndex = collections.findIndex(collection => collection.id === requestedCollection);
    let activeCollectionIndex = requestedCollectionIndex >= 0 ? requestedCollectionIndex : 0;
    let activeIndex = 0;
    let speed = 1;
    let installPrompt = null;

    const sentenceParts = text => text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];

    function renderTranscript(text) {
      transcript.replaceChildren(...sentenceParts(text).map(sentence => {
        const span = document.createElement('span');
        span.className = 'sentence';
        span.textContent = sentence.trim();
        return span;
      }));
    }

    function activeItems() {
      return collections[activeCollectionIndex].items;
    }

    function loadItem(index, shouldFocus = false) {
      activeIndex = index;
      const item = activeItems()[index];
      audio.pause();
      audio.src = item.audio;
      audio.playbackRate = speed;
      playerStatus.textContent = '';
      number.textContent = String(item.number).padStart(2, '0');
      collectionTitle.textContent = collections[activeCollectionIndex].title;
      title.textContent = item.title;
      renderTranscript(item.transcript);
      select.value = String(index);
      document.querySelectorAll('.page-button').forEach((button, buttonIndex) => {
        button.setAttribute('aria-current', buttonIndex === index ? 'true' : 'false');
      });
      if (shouldFocus) title.scrollIntoView({behavior: 'smooth', block: 'start'});
    }

    function renderItemList() {
      select.replaceChildren();
      list.replaceChildren();
      activeItems().forEach((item, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${String(item.number).padStart(2, '0')} · ${item.title}`;
        select.append(option);

        const listItem = document.createElement('li');
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'page-button';
        button.innerHTML = `<span class="number">${String(item.number).padStart(2, '0')}</span><span></span>`;
        button.lastElementChild.textContent = item.title;
        button.addEventListener('click', () => loadItem(index, true));
        listItem.append(button);
        list.append(listItem);
      });
    }

    collections.forEach((collection, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = `${collection.title} · ${collection.items.length}`;
      collectionSelect.append(option);
    });

    collectionSelect.addEventListener('change', event => {
      activeCollectionIndex = Number(event.target.value);
      window.history.replaceState(null, '', `#${collections[activeCollectionIndex].id}`);
      renderItemList();
      loadItem(0);
    });
    select.addEventListener('change', event => loadItem(Number(event.target.value)));
    document.querySelector('#rewind').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 5); });
    repeatPage.addEventListener('change', event => {
      audio.loop = event.target.checked;
      if (event.target.checked) repeatAll.setAttribute('aria-pressed', 'false');
    });
    repeatAll.addEventListener('click', () => {
      const enabled = repeatAll.getAttribute('aria-pressed') !== 'true';
      repeatAll.setAttribute('aria-pressed', enabled ? 'true' : 'false');
      if (enabled) {
        repeatPage.checked = false;
        audio.loop = false;
      }
    });
    audio.addEventListener('ended', () => {
      if (repeatAll.getAttribute('aria-pressed') !== 'true') return;
      loadItem((activeIndex + 1) % activeItems().length);
      audio.play().catch(error => {
        console.error('Repeat All playback was interrupted', error);
        playerStatus.textContent = '瀏覽器暫停了連續播放，請按播放繼續。';
      });
    });
    speedButtons.forEach(button => button.addEventListener('click', () => {
      speed = Number(button.dataset.speed);
      audio.playbackRate = speed;
      speedButtons.forEach(item => item.setAttribute('aria-pressed', item === button ? 'true' : 'false'));
    }));
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      installPrompt = event;
      installStatus.textContent = '已可安裝，點擊按鈕後確認即可。';
    });
    installButton.addEventListener('click', async () => {
      if (window.matchMedia('(display-mode: standalone)').matches) {
        installStatus.textContent = '這個練習頁已經安裝在裝置上。';
        return;
      }
      if (!installPrompt) {
        installStatus.textContent = '若未出現安裝視窗，請重新整理一次，或從 Chrome 選單選擇「安裝應用程式」。';
        return;
      }
      installPrompt.prompt();
      const choice = await installPrompt.userChoice;
      installStatus.textContent = choice.outcome === 'accepted' ? '安裝完成，可從手機桌面開啟。' : '尚未安裝，你可以稍後再試。';
      installPrompt = null;
    });
    window.addEventListener('appinstalled', () => {
      installButton.hidden = true;
      installStatus.textContent = '安裝完成，可從手機桌面開啟。';
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(error => {
          console.error('Service worker registration failed', error);
          installStatus.textContent = '安裝元件載入失敗，請重新整理後再試。';
        });
      });
    }
    document.addEventListener('keydown', event => {
      if (['INPUT', 'SELECT', 'BUTTON'].includes(document.activeElement.tagName)) return;
      if (event.code === 'Space') { event.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
      if (event.key === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
      if (event.key === 'ArrowRight') audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + 5);
    });

    collectionSelect.value = String(activeCollectionIndex);
    renderItemList();
    loadItem(0);
  </script>
</body>
